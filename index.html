let dsDrag=null;
main.addEventListener('dragstart',e=>{const d=e.target.closest&&e.target.closest('.dsrow');if(!d)return;dsDrag=d.dataset.dsid;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dsDrag)}catch(_){}d.classList.add('dragging')});
main.addEventListener('dragover',e=>{if(!dsDrag)return;const d=e.target.closest&&e.target.closest('.dsrow');if(!d)return;e.preventDefault();main.querySelectorAll('.drop-before,.drop-after').forEach(x=>x.classList.remove('drop-before','drop-after'));if(d.dataset.dsid===dsDrag)return;const r=d.getBoundingClientRect();d.classList.add(e.clientY>r.top+r.height/2?'drop-after':'drop-before')});
main.addEventListener('drop',e=>{if(!dsDrag)return;const d=e.target.closest&&e.target.closest('.dsrow');e.preventDefault();if(d&&d.dataset.dsid!==dsDrag){const after=d.classList.contains('drop-after');const ids=[...main.querySelectorAll('.dsrow')].map(x=>x.dataset.dsid).filter(x=>x!==dsDrag);let k=ids.indexOf(d.dataset.dsid);if(after)k++;ids.splice(k,0,dsDrag);setDsOrder(ids)}dsDrag=null;render()});
main.addEventListener('dragend',()=>{if(dsDrag){dsDrag=null;render()}});
main.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('.badgebox')){state.settings.badgesOpen=e.target.open;save()}},true);
main.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('.dsrow')){state.settings.dsOpen=state.settings.dsOpen||{};state.settings.dsOpen[e.target.dataset.dsid]=e.target.open;save()}},true);
main.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.atk){const k=el.dataset.atk;let v=el.type==='checkbox'?el.checked:(el.type==='number'?Number(el.value):el.value);ATK[k]=v;if(k==='unit'&&BATTLE){const u=BATTLE.units[ATK.side].find(x=>x.uid===v);ATK.weapon=0;ATK.models=u?u.left:1}if(k==='weapon')ATK.weapon=Number(v);render();return}
  if(el.dataset.actionChk==='bShock'&&BATTLE){const u=BATTLE.units[el.dataset.side][+el.dataset.i];u.shocked=el.checked;blog(`${u.name} ${el.checked?'is Battle-shocked':'is no longer Battle-shocked'}`,el.dataset.side);bCommit();return}
  if(el.dataset.bind&&el.dataset.bind.startsWith('__b.')&&BATTLE){let v=el.dataset.type==='num'?n(el.value):el.value;const ks=el.dataset.bind.slice(4).split('.');let o=BATTLE;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]]}o[ks[ks.length-1]]=v;bCommit();return}
  const path=el.dataset.bind; if(!path)return;
  let v;
  if(el.dataset.type==='bool') v=el.checked;
  else if(el.dataset.type==='num') v=n(el.value);
  else v=el.value;
  setPath(path,v);
  if(path.endsWith('.type')&&path.includes('honours')&&v==='CR'){const hp=path.replace(/\.type$/,'.tier');if(!getPath(hp))setPath(hp,'Artificer')}
  save(); render(true);
});

function rollD(n_,s){let t=0;for(let i=0;i<n_;i++)t+=1+Math.floor(Math.random()*s);return t}
function rollExpr(e){
  e=e.replace('+','');
  if(e==='D3+3') return rollD(1,3)+3;
  let m=e.match(/^(\d*)D(\d)$/); if(m) return rollD(Number(m[1]||1),Number(m[2]));
  return Number(e);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]'); if(!b)return;
  const a=b.dataset.action;
  if(a==='stratFilter'){state.settings.stratFilter=b.dataset.val;save();render();return}
  if(a==='dsMove'){e.preventDefault();const ids=[...main.querySelectorAll('.dsrow')].map(d=>d.dataset.dsid);const i=ids.indexOf(b.dataset.id),j=i+Number(b.dataset.val);if(i<0||j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];setDsOrder(ids);render();const nb=main.querySelector(`[data-action="dsMove"][data-id="${b.dataset.id}"][data-val="${b.dataset.val}"]`);if(nb)nb.focus();return}
  if(a==='bJoin'){bJoin((document.getElementById('bCode')||{}).value||'');render();return}
  if(a==='bRandom'){const el=document.getElementById('bCode');if(el)el.value=Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');return}
  if(a==='bHotseat'){bHotseat();return}
  if(a==='bLeave'){bLeave();return}
  if(a.startsWith('b')&&/^b[A-Z]/.test(a)&&bAction(a,b))return;
  if(a==='umAdd'){const ds=document.getElementById('umAddDs').value;const nm=document.getElementById('umAddName').value.trim()||ds;const md=Math.max(1,n(document.getElementById('umAddModels').value));umState().units.push({id:'m'+Date.now(),name:nm,ds,models:md,pts:UM_DS[ds].pts,xp:0,honours:'',scars:'',lists:umState().lists.map(()=>false)});save();render();return}
  if(a==='umDel'){const i=Number(b.dataset.i);const u=umState().units[i];if(confirm(`Remove ${u.name}?`)){umState().units.splice(i,1);save();render()}return}
  if(a==='depPhase'){depState().phase=b.dataset.val;save();document.querySelectorAll('[data-action="depPhase"]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.val===b.dataset.val)));const sg=depSel&&document.querySelector(`#depsvg .tok[data-uid="${depSel.uid}"][data-mi="${depSel.mi}"]`);drawRanges(sg||null);return}
  if(a==='depRot'){depRotate(Number(b.dataset.val));return}
  if(a==='depMode'){depState().mode=b.dataset.val;save();render();return}
  if(a==='depResetUnits'){const D=depState();const li=Math.min(n(state.settings.dsList),state.lists.length-1);Object.keys(D.pos).forEach(k=>{if(k.startsWith(li+':'))delete D.pos[k]});save();render();return}
  if(a==='depResetObj'){const D=depState();delete D.obj[D.layout];save();render();return}
  if(a==='depSave'){const D=depState();const li=Math.min(n(state.settings.dsList),state.lists.length-1);const nm=(document.getElementById('presetName').value||'').trim()||`${(LAYOUTS[D.layout]||{}).name} ${new Date().toLocaleDateString()}`;
    const pos={};Object.entries(D.pos).forEach(([k,v])=>{if(k.startsWith(li+':'))pos[k]=JSON.parse(JSON.stringify(v))});
    state.deployPresets=state.deployPresets||[];state.deployPresets.push({name:nm,li,layout:D.layout,terrain:D.terrain||'none',flip:!!D.flip,pos,obj:D.obj[D.layout]?JSON.parse(JSON.stringify(D.obj[D.layout])):null});save();render();return}
  if(a==='depLoad'){const p=(state.deployPresets||[])[Number(b.dataset.i)];if(!p)return;const D=depState();D.layout=p.layout;D.flip=p.flip;D.terrain=p.terrain||'none';Object.keys(D.pos).forEach(k=>{if(k.startsWith(p.li+':'))delete D.pos[k]});Object.assign(D.pos,JSON.parse(JSON.stringify(p.pos)));if(p.obj)D.obj[p.layout]=JSON.parse(JSON.stringify(p.obj));else delete D.obj[p.layout];state.settings.dsList=p.li;save();render();return}
  if(a==='depDel'){const i=Number(b.dataset.i);const p=state.deployPresets[i];if(p&&confirm(`Delete preset “${p.name}”?`)){state.deployPresets.splice(i,1);save();render()}return}
  if(a==='dsList'){state.settings.dsList=Number(b.dataset.val);save();render();return}
  if(a==='dsAll'){const open=b.dataset.val==='1';state.settings.dsOpen=state.settings.dsOpen||{};state.units.forEach(u=>state.settings.dsOpen[u.id]=open);save();render();return}
  if(a==='cardScroll'){const c=main.querySelector('.cards');if(c){const card=c.querySelector('.ccard');const step=card?card.getBoundingClientRect().width+18:380;c.scrollBy({left:step*Number(b.dataset.val),behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}return}
  if(a==='cardsFilter'){state.settings.cardsFilter=b.dataset.val;save();render();return}
  if(a==='addBattle'){state.battles.push({date:new Date().toISOString().slice(0,10),opponent:'',result:'W',prey:0,preyBio:0,tyr:0,tyrBio:0,infestBio:0,killedAll:false,notes:'',bio:{},rp:{}});save();render();
    const sc=main.querySelector('[data-keep-scroll]');if(sc)sc.scrollLeft=sc.scrollWidth;return}
  if(a==='delBattle'){const i=Number(b.dataset.i);if(confirm(`Delete battle ${i+1}? Its Biomass and RP entries are removed.`)){state.battles.splice(i,1);save();render()}return}
  if(a==='focusAdd'){const f=document.getElementById('addUnit');f.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>document.getElementById('addDs').focus(),300);return}
  if(a==='addUnit'){
    const ds=document.getElementById('addDs').value;
    const name=document.getElementById('addName').value.trim()||ds;
    const models=Math.max(1,n(document.getElementById('addModels').value));
    const pts=n(document.getElementById('addPts').value);
    const cp=n(document.getElementById('addCP').value);
    const ch=document.getElementById('addChar').checked, ep=document.getElementById('addEpic').checked;
    const c=calc();
    state.units.push({id:'u'+Date.now(),name,ds,models,pts,xp:0,cpAdj:cp,character:ch||ep,epic:ep,warlord:false,titanic:false,type:'',equip:'',enh:'',honours:[],scars:[],t:{played:0,skipped:0,survived:0,destroyed:0,mfg:0,prey:0,spores:0,killedAll:0},notes:'',lists:state.lists.map(()=>false)});
    save();render();
    const msg=document.getElementById('addMsg');
    if(msg){msg.textContent=(c.used+pts>c.supply)?`Added ${name}, but you are now ${c.used+pts-c.supply} pts over your Supply Limit.`:`Added ${name}. Its Crusade card is ready on the Crusade Cards page.`;msg.className='small '+((c.used+pts>c.supply)?'warn':'ok')}
    return}
  if(a==='delUnit'){const i=Number(b.dataset.i);const u=state.units[i];if(confirm(`Remove ${u.name} from your Order of Battle? Removed units cannot be added back, and their honours are lost.`)){state.units.splice(i,1);save();render()}return}
  if(a==='editCard'){editing=b.dataset.id;render();return}
  if(a==='addPhoto'){photoTarget=b.dataset.id;document.getElementById('photoFile').click();return}
  if(a==='delPhoto'){const u=state.units.find(x=>x.id===b.dataset.id);if(u&&confirm(`Remove the photo of ${u.name}?`)){delete u.photo;save();render()}return}
  if(a==='doneCard'){editing=null;render();return}
  if(a==='addHonour'){const u=state.units[Number(b.dataset.i)];u.honours.push(H('BT',''));save();render();return}
  if(a==='delHonour'){const u=state.units[Number(b.dataset.i)];u.honours.splice(Number(b.dataset.j),1);save();render();return}
  if(a==='addScar'){const u=state.units[Number(b.dataset.i)];if(u.scars.length<3){u.scars.push('');save();render()}return}
  if(a==='delScar'){const u=state.units[Number(b.dataset.i)];u.scars.splice(Number(b.dataset.j),1);save();render();return}
  if(a==='rollWorld'){
    if(!confirm('Roll a new world? This replaces the world type and stage targets (battles stay recorded).'))return;
    const d=rollD(1,6); const type=d<=2?'Industrial World':(d<=4?'Rural World':'Hive World');
    const rows=WORLD_TABLES[type].rows; let bio=0; const t=[]; const notes=[];
    rows.forEach((r,i)=>{const add=rollExpr(r[0]);bio+=add;const bp=rollExpr(r[1]);t.push({bio,bp});notes.push(`${STAGE_NAMES[i]}: ${r[0]} → ${i?'+':''}${add} (${bio}), ${r[1]} → ${bp} battles`)});
    const cw=calc(); if(cw.stage>=3) state.devoured=(state.devoured||[]).concat(state.world.type);
    state.world={type,name:'',targets:t,startBattle:state.battles.length,rolls:`D6 = ${d}. `+notes.join('. ')+'.'};save();render();return}
  if(a==='export'){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);const l=document.createElement('a');l.href=url;l.download='crusade-data.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);return}
  if(a==='import'){document.getElementById('importFile').click();return}
  if(a==='reset'){if(confirm('Reset everything to the values from your spreadsheet? Your changes in this browser are lost.')){state=clone(DEFAULT_STATE);save();editing=null;render()}return}
});
let photoTarget=null;
document.getElementById('photoFile').addEventListener('change',e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f||!photoTarget)return;
  const id=photoTarget; photoTarget=null;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=640; const sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas'); cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      const u=state.units.find(x=>x.id===id); if(!u)return;
      u.photo=cv.toDataURL('image/jpeg',0.78); save(); render();
    };
    img.onerror=()=>alert('That file could not be read as an image. Try a JPG or PNG.');
    img.src=r.result;
  };
  r.readAsDataURL(f);
});
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!Array.isArray(s.units))throw 0;state=migrate(s);save();render();alert('Data imported.')}catch(err){alert('That file is not a Crusade data export. Choose a file saved with Export data.')}};r.readAsText(f);e.target.value='';
});

render();
netInit();
</script>
