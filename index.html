<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hive Fleet Crusade – Tyranids Invasion Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Saira+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efe6d2; --surface:#f7f0e0; --surface-2:#e7dcc3; --ink:#2a1b30; --muted:#6a5a6d;
  --chitin:#5e2a72; --chitin-ink:#f7f0e0; --synapse:#256f63; --blood:#962d3b; --bio:#7a2ba3; --syn:#1d5ea8; --epic:#3f1257;
  --line:#cdbd9c; --line-strong:#8f7c5c;
  --paper:#e9dec4; --paper-ink:#2b2219; --paper-line:#4a3d2c; --paper-cell:#f1e8d3;
  --tactic:#2c7a5e; --ploy:#3a4f9a; --deed:#8a5a14; --wargear:#9a2f3d;
  --focus:#c25ad8;
  --head:"Saira Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Alegreya",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1320; --surface:#251a2c; --surface-2:#2f2237; --ink:#ece3cf; --muted:#a898ae;
    --chitin:#8a4aa1; --chitin-ink:#fbf4e6; --synapse:#8fd3c2; --blood:#e07583; --bio:#c98ff0; --syn:#7fb8f2; --epic:#9a5cc4;
    --line:#3e2d47; --line-strong:#6a5374;
    --paper:#2a2130; --paper-ink:#ebe0c8; --paper-line:#a8957a; --paper-cell:#33283a;
    --tactic:#4fb08c; --ploy:#7b8fe0; --deed:#d29a45; --wargear:#e07583;
    --focus:#e09af0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1320; --surface:#251a2c; --surface-2:#2f2237; --ink:#ece3cf; --muted:#a898ae;
  --chitin:#8a4aa1; --chitin-ink:#fbf4e6; --synapse:#8fd3c2; --blood:#e07583; --bio:#c98ff0; --syn:#7fb8f2; --epic:#9a5cc4;
  --line:#3e2d47; --line-strong:#6a5374;
  --paper:#2a2130; --paper-ink:#ebe0c8; --paper-line:#a8957a; --paper-cell:#33283a;
  --tactic:#4fb08c; --ploy:#7b8fe0; --deed:#d29a45; --wargear:#e07583;
  --focus:#e09af0;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
img{max-width:100%}
a{color:var(--chitin)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--head);line-height:1.1;margin:0 0 .4em;font-weight:700;letter-spacing:.01em}
h1{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:800}
h2{font-size:1.75rem;margin-top:1.6em}
h3{font-size:1.3rem}
h4{font-size:1.08rem}
p{margin:.3em 0 .8em}
.muted{color:var(--muted)}
.small{font-size:.9rem}

/* layout */
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--surface) 250px,var(--bg) 250px)}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px 18px;display:flex;flex-direction:column;gap:16px}
.brand{font-family:var(--head);font-weight:800;font-size:1.45rem;line-height:1;color:var(--chitin);padding:0 8px}
.brand small{display:block;font-weight:500;font-size:.95rem;color:var(--muted);margin-top:4px}
.status{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 4px}
.status div{background:var(--surface-2);border-radius:6px;padding:6px 8px;font-family:var(--head)}
.status b{display:block;font-size:1.3rem;line-height:1}
.status span{font-size:.8rem;color:var(--muted)}
.status .wide{grid-column:span 2}
nav.tabs{display:flex;flex-direction:column;gap:2px}
nav.tabs a{font-family:var(--head);font-weight:600;font-size:1.05rem;text-decoration:none;color:var(--ink);padding:7px 10px 7px 14px;border-radius:0 18px 18px 0;border-left:3px solid transparent}
nav.tabs a:hover{background:var(--surface-2)}
nav.tabs a[aria-current="page"]{background:var(--chitin);color:var(--chitin-ink);border-left-color:var(--synapse)}
.rail-tools{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;padding:0 4px}
.rail-tools button{font-size:.85rem}
main{padding:34px clamp(16px,4vw,56px) 80px;max-width:1280px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--chitin);padding-bottom:10px;margin-bottom:22px}
.page-head p{margin:0;max-width:62ch}
.prose{max-width:72ch}

/* buttons/inputs */
button,.btn{font-family:var(--head);font-weight:600;font-size:.98rem;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:5px;cursor:pointer}
button:hover{border-color:var(--chitin)}
button.primary{background:var(--chitin);color:var(--chitin-ink);border-color:var(--chitin)}
button.ghost{background:transparent}
button.danger{color:var(--blood);border-color:var(--blood);background:transparent}
input,select,textarea{font:inherit;font-size:.95rem;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding:4px 6px;max-width:100%}
textarea{width:100%;min-height:72px;resize:vertical}
input[type=number]{width:4.6em}
input[type=checkbox],input[type=radio]{accent-color:var(--chitin);width:18px;height:18px;vertical-align:middle}
label{cursor:pointer}

/* generic blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:0 0 16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.kw{font-family:var(--head);font-weight:700;letter-spacing:.02em}
.tag{display:inline-block;font-family:var(--head);font-weight:600;font-size:.82rem;padding:1px 7px;border-radius:3px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);margin:1px 2px 1px 0;white-space:nowrap}
.tag.bt{border-color:var(--synapse);color:var(--synapse)}
.tag.wm{border-color:var(--deed);color:var(--deed)}
.tag.cr{border-color:var(--chitin);color:var(--chitin)}
.tag.scar{border-color:var(--blood);color:var(--blood)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--head);font-weight:700;font-size:.95rem;background:var(--surface-2)}
.num{text-align:center;font-variant-numeric:tabular-nums}
.hl td{background:color-mix(in srgb,var(--chitin) 14%,transparent)}
.rule{border-left:3px solid var(--chitin);padding:2px 0 2px 14px;margin:0 0 14px}
.rule h4{margin:0 0 2px}
.rule p{margin:0 0 4px}
.d6{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:5px;background:var(--chitin);color:var(--chitin-ink);font-family:var(--head);font-weight:700;font-size:.95rem;margin-right:8px;flex:none}
.d6row{display:flex;align-items:flex-start;gap:4px;padding:8px 0;border-bottom:1px dashed var(--line)}
.d6row:last-child{border-bottom:0}
.d6row p{margin:0}
.note{font-size:.92rem;color:var(--muted);border-left:3px solid var(--line-strong);padding-left:10px}
.warn{color:var(--blood);font-weight:500}
.ok{color:var(--synapse);font-weight:500}
.seq{counter-reset:s;list-style:none;padding:0;margin:0}
.seq li{counter-increment:s;position:relative;padding:4px 0 10px 42px}
.seq li::before{content:counter(s);position:absolute;left:0;top:2px;width:28px;height:28px;border-radius:50%;background:var(--chitin);color:var(--chitin-ink);font-family:var(--head);font-weight:700;display:grid;place-items:center}

/* introduction: adaptations */
.adapt{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:10px 0 6px}
.adapt label{display:block;border:1px solid var(--line-strong);border-radius:8px;padding:12px 14px;background:var(--surface)}
.adapt label:has(input:checked){border:2px solid var(--chitin);background:color-mix(in srgb,var(--chitin) 12%,var(--surface))}
.adapt b{font-family:var(--head);font-size:1.15rem}
.adapt .on{display:none;font-family:var(--head);font-size:.85rem;color:var(--chitin)}
.adapt label:has(input:checked) .on{display:inline}

/* stratagems */
.phase{margin:22px 0 8px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.phase h3{margin:0;font-size:1.45rem}
.strats{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.strat{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--ploy);border-radius:6px;padding:12px 14px}
.strat.tactic{border-left-color:var(--tactic)}
.strat.ploy{border-left-color:var(--ploy)}
.strat.deed{border-left-color:var(--deed)}
.strat.wargear{border-left-color:var(--wargear)}
.strat header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.strat h4{margin:0;font-size:1.2rem}
.cp{font-family:var(--head);font-weight:800;font-size:1.05rem;border:2px solid currentColor;border-radius:50%;min-width:44px;height:44px;display:grid;place-items:center;color:var(--chitin);flex:none}
.strat .meta{font-family:var(--head);font-size:.88rem;color:var(--muted);margin:2px 0 8px}
.strat dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.95rem}
.strat dt{font-family:var(--head);font-weight:700}
.strat dd{margin:0}
.strat.core{background:var(--bg)}
.filter{display:flex;gap:6px;flex-wrap:wrap}
.filter button[aria-pressed="true"]{background:var(--chitin);color:var(--chitin-ink);border-color:var(--chitin)}

/* world / progress */
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stage{border:1px solid var(--line-strong);border-radius:8px;padding:12px;background:var(--surface)}
.stage.current{border:2px solid var(--bio)}
.stage h4{color:var(--bio)}
.bio-t{color:var(--bio)}
.bignums div.bio{border-color:var(--bio)}
.bignums div.bio b,.bignums div.bio span{color:var(--bio)}
.status div.bio b,.status div.bio span{color:var(--bio)}
.tally tr.bio td:first-child,.tally tr.bio.calc td{color:var(--bio)}
.tally tr.sec.bio td{color:var(--bio)}
.box.bio{border-color:var(--bio)}
.box.bio .val,.box.bio .lbl{color:var(--bio)}
.box.bio .lbl{border-top-color:var(--bio)}
.stage.done{opacity:.8}
.stage h4{display:flex;justify-content:space-between;gap:8px}
.bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin:3px 0 8px}
.bar i{display:block;height:100%;background:var(--bio)}
.bar.bp i{background:var(--synapse)}
@media (max-width:700px){.stages{grid-template-columns:1fr}}

/* tally */
.tally{min-width:900px}
.tally th:first-child,.tally td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:250px}
.tally th:first-child{background:var(--surface-2)}
.tally td{padding:4px 6px}
.tally td input[type=number]{width:3.6em}
.tally td input[type=date]{width:8.8em;font-size:.85rem}
.tally td select{font-size:.85rem}
.tally .sec td{background:var(--surface-2);font-family:var(--head);font-weight:700;font-size:1rem}
.tally .sec td:first-child{background:var(--surface-2)}
.tally .calc td{font-weight:700}
.tally .calc td:first-child{font-weight:500}
.tally .cost{color:var(--muted);font-size:.85rem}
.bignums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.bignums div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.bignums b{font-family:var(--head);font-size:2rem;line-height:1;display:block}
.bignums span{font-family:var(--head);color:var(--muted);font-size:.95rem}

/* order of battle sheet */
.sheet{background:var(--paper);color:var(--paper-ink);border:3px solid var(--paper-line);border-radius:4px;padding:18px;box-shadow:inset 0 0 0 6px var(--paper),inset 0 0 0 7px var(--paper-line);font-family:var(--head)}
.sheet input,.sheet select,.sheet textarea{background:var(--paper-cell);color:var(--paper-ink);border-color:var(--paper-line)}
.sheet .row1{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:18px;align-items:center}
.box{border:2px solid var(--paper-line);background:var(--paper-cell);padding:6px 10px 4px;border-radius:2px;min-width:0}
.box .lbl{display:block;font-size:.78rem;font-weight:700;letter-spacing:.06em;border-top:1px dotted var(--paper-line);margin-top:4px;padding-top:2px}
.box .val{font-size:1.5rem;font-weight:700;line-height:1.2;min-height:1.2em;overflow-wrap:anywhere}
.box .val input{font-size:1.25rem;width:100%;font-family:var(--head);font-weight:700;background:transparent;border:0;padding:0;color:var(--paper-ink)}
.dials{display:flex;gap:12px;flex-wrap:nowrap;justify-content:flex-end}
.dial{width:118px;height:118px;flex:none;border-radius:50%;border:2px solid var(--paper-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;background:var(--paper-cell);padding:12px}
.dial b{font-size:2.9rem;line-height:.9;font-weight:800}
.dial span{font-size:.8rem;font-weight:700;letter-spacing:.03em;line-height:1.05;max-width:84px}
.dial.bio{border-color:var(--bio);border-width:3px}
.dial.bio b,.dial.bio span{color:var(--bio)}
.glyph{width:124px;height:124px;color:var(--paper-ink)}
.badgebox{border:2px solid var(--bio);background:var(--paper-cell);padding:6px 10px;margin:0 0 14px}
.badgebox summary{display:flex;align-items:center;gap:14px;cursor:pointer;list-style:none;padding:2px 0}
.badgebox summary::-webkit-details-marker{display:none}
.bsum-title{font-size:.85rem;font-weight:700;letter-spacing:.12em;color:var(--bio)}
.badgebox .bcount{color:var(--bio)}
.bmini{display:flex;gap:8px}
.bmini .cbadge-svg{width:38px;height:38px}
.bmini .mini.locked .cbadge-svg{opacity:.22;filter:grayscale(1)}
.badgebox[open] .bmini{display:none}
.bcount{font-size:.82rem;opacity:.75;margin-left:auto}
.bchev{width:10px;height:10px;border-right:2px solid var(--paper-line);border-bottom:2px solid var(--paper-line);transform:rotate(45deg);margin:0 4px 4px 0;transition:transform .2s}
.badgebox[open] .bchev{transform:rotate(-135deg);margin:4px 4px 0 0}
.badgebox[open] summary{margin-bottom:10px}
.cbadges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cbadge{display:flex;gap:12px;align-items:center;min-width:0}
.cbadge-svg{width:78px;height:78px;flex:none;transition:opacity .4s,filter .4s}
.cbadge.locked .cbadge-svg{opacity:.22;filter:grayscale(1)}
.cbadge.locked b,.cbadge.locked .desc{opacity:.55}
.cbadge b{font-family:var(--head);font-size:1.08rem;display:block;line-height:1.1}
.cbadge .st{font-family:var(--head);font-size:.78rem;font-weight:700;letter-spacing:.04em}
.cbadge.earned .st{color:var(--synapse)}
.cbadge.locked .st{opacity:.6}
.cbadge .desc{display:block;font-family:var(--body);font-size:.82rem;line-height:1.3;margin:2px 0}
.cbadge ul{list-style:none;margin:0;padding:0;font-family:var(--head);font-size:.76rem;line-height:1.35;opacity:.8}
.cbadge li.met{font-weight:700;opacity:1}
.cbadge li.met::before{content:"\2713 "}
@media (max-width:980px){.cbadges{grid-template-columns:1fr}}
.sheet .row2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.stagebox .val{font-size:1.15rem}
.oob{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 230px;gap:14px}
.oob-col{display:flex;flex-direction:column;gap:5px}
.oob-head{display:grid;grid-template-columns:minmax(0,1fr) 62px 62px;font-size:.78rem;font-weight:700;letter-spacing:.05em;align-items:end;padding:0 2px}
.oob-head span:not(:first-child){text-align:center}
.slot{display:grid;grid-template-columns:minmax(0,1fr) 62px 62px;border:2px solid var(--paper-line);background:var(--paper-cell);min-height:46px}
.slot>div{padding:4px 8px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.slot>div+div{border-left:2px solid var(--paper-line);align-items:center;font-size:1.2rem;font-weight:700}
.slot .nm{font-weight:700;font-size:1.02rem;line-height:1.1;overflow-wrap:anywhere}
.slot .ds{font-size:.8rem;opacity:.75;font-family:var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.empty button{background:transparent;border:1px dashed var(--paper-line);color:var(--paper-ink);font-size:.85rem;padding:3px 8px;opacity:.75;align-self:flex-start}
.slot.empty>div+div{opacity:.4}
.achv{border:2px solid var(--paper-line);background:var(--paper-cell);padding:8px;display:flex;flex-direction:column}
.achv h4{text-align:center;font-size:.85rem;letter-spacing:.12em;margin:2px 0 6px}
.achv textarea{flex:1;min-height:240px;background:transparent;border:0;font-family:var(--body);font-size:.95rem;color:var(--paper-ink)}
.sheet-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:2px solid var(--paper-line);margin-top:14px;padding-top:6px;font-size:.78rem;letter-spacing:.06em}
@media (max-width:1300px){.glyph{display:none}.sheet .row1{grid-template-columns:minmax(0,1fr) 0 auto}}
@media (max-width:1180px){.sheet .row1{grid-template-columns:1fr}.dials{justify-content:flex-start}}
@media (max-width:980px){.sheet .row1{grid-template-columns:1fr}.glyph{display:none}.dials{justify-content:flex-start}.oob{grid-template-columns:1fr}.sheet .row2{grid-template-columns:1fr 1fr}}
.roster td,.roster th{white-space:nowrap}
.roster td input[type=text]{width:12em}
.roster .listcol{text-align:center}
.addform{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.addform label{display:flex;flex-direction:column;font-family:var(--head);font-size:.9rem;gap:2px}
.listsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:12px 0}
.listsum div{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface)}
.listsum b{font-family:var(--head);font-size:1.4rem}

/* crusade cards */
.cards{display:flex;gap:18px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding-left:4px;padding:4px 4px 16px;align-items:flex-start;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.cards>.ccard{flex:0 0 380px;scroll-snap-align:start}
.cardnav{display:flex;gap:6px;margin-left:auto}
.ccard{background:var(--paper);color:var(--paper-ink);border:3px solid var(--paper-line);clip-path:polygon(0 0,100% 0,100% calc(100% - 34px),calc(100% - 34px) 100%,0 100%);padding:12px;font-family:var(--head);display:flex;flex-direction:column;gap:8px}
.ccard .top{display:grid;grid-template-columns:minmax(0,1fr) 66px 66px;border:2px solid var(--paper-line);background:var(--paper-cell)}
.ccard .top>div{padding:4px 8px;min-width:0}
.ccard .top>div+div{border-left:2px solid var(--paper-line);text-align:center}
.ccard .uname{font-weight:800;font-size:1.25rem;line-height:1.05}
.ccard .lbl{font-size:.68rem;font-weight:700;letter-spacing:.06em;display:block;opacity:.85}
.ccard .bn{font-size:1.8rem;font-weight:800;line-height:1.05}
.ccard .mid{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:8px}
.ccard .cell{border:2px solid var(--paper-line);background:var(--paper-cell);padding:5px 8px;font-size:.95rem;min-width:0}
.ccard .cell ul{margin:0;padding-left:16px;font-family:var(--body);font-size:.92rem}
.ccard .cell p{margin:0;font-family:var(--body);font-size:.92rem}
.xpcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.xpdial{width:100px;height:100px;border-radius:50%;border:2px solid var(--paper-line);background:var(--paper-cell);display:grid;place-items:center;text-align:center}
.xpdial b{font-size:2.7rem;line-height:.95;display:block;font-weight:800}

/* =========================================================
   STATE + PERSISTENCE
   ========================================================= */
const KEY='hive-fleet-crusade-v1';
let state;
function clone(o){return JSON.parse(JSON.stringify(o))}
function load(){
  try{const raw=localStorage.getItem(KEY); if(raw){const s=JSON.parse(raw); if(s && (s.v===1||s.v===2) && Array.isArray(s.units)){state=migrate(s);save();return;}}}catch(e){}
  state=clone(DEFAULT_STATE);
}
let saveWarned=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){if(!saveWarned){saveWarned=true;alert('Your browser storage is full, so the latest change was not saved. Remove a photo or use Export data to keep a copy.')}}}
function wahaUrl(ds){return 'https://wahapedia.ru/wh40k10ed/factions/tyranids/'+String(ds).trim().replace(/[’']/g,'-').replace(/\s+/g,'-')}
/* v1 -> v2: one Weapon Modification honour = two modifications on the same weapon */
function migrate(s){
  (s.units||[]).forEach(u=>{if(u.ds==='Parasite of Mordrex')u.ds='Parasite of Mortrex';if(u.ds==='Norn Emissary'&&!u.normFix){u.character=false;u.type=(u.type||'').split(',').map(x=>x.trim()).filter(x=>x&&x.toLowerCase()!=='character').join(', ');u.normFix=true}
    if(u.id==='u1'&&!u.props)u.props=['mic'];if(u.id==='u4'&&!u.art)u.art='chan';if(u.id==='u13'&&!u.art)u.art='neurochan';if(u.id==='u13'&&!/synapse/i.test(u.type||''))u.type=(u.type?u.type+', ':'')+'Synapse';if(u.id==='u14'&&!/synapse/i.test(u.type||''))u.type=(u.type?u.type+', ':'')+'Synapse'});
  if(s.v===1){
    s.units.forEach(u=>{
      const out=[], byWeapon={};
      (u.honours||[]).forEach(h=>{
        if(h.type!=='WM'){out.push(h);return}
        const k=h.name.indexOf(':'); const w=k>0?h.name.slice(0,k).trim():h.name; const m=k>0?h.name.slice(k+1).trim():'';
        const ex=byWeapon[w];
        if(ex&&ex.n<2){ex.h.name+=', '+m;ex.h.detail=[ex.h.detail,h.detail].filter(Boolean).join(', ');ex.n++;return}
        const nh=Object.assign({},h); out.push(nh); byWeapon[w]={h:nh,n:1};
      });
      u.honours=out;
    });
    s.v=2;
  }
  return s;
}
load();

/* =========================================================
   CALCULATIONS
   ========================================================= */
function n(v){v=Number(v);return isFinite(v)?v:0}
function sumObj(o){return Object.values(o||{}).reduce((a,b)=>a+n(b),0)}
function calc(){
  const T=state.world.targets;
  let total=0, worldTotal=0, currency=0, rp=n(state.force.startRP), stage=0, stageBP=0, wins=0, bpTotal=0;
  const ws=n(state.world.startBattle);
  let supplySpent=0, swarmSpent=0;
  const rows=[];
  state.battles.forEach((b,i)=>{
    const resBio=b.result==='W'?1:(b.result==='L'?-1:0);
    const kaBio=b.killedAll?4:0;
    const gained=resBio+n(b.preyBio)+n(b.tyrBio)+n(b.infestBio)+kaBio;
    const before=total;
    total=Math.max(0,total+gained);
    const bp=b.killedAll?2:1;
    let stageAt=-1, completed=false;
    if(i>=ws){
      worldTotal=Math.max(0,worldTotal+gained);
      bpTotal+=bp;
      stageAt=stage;
      stageBP+=bp;
      if(stage<3 && worldTotal>=n(T[stage].bio) && stageBP>=n(T[stage].bp)){stage++;stageBP=0;completed=true}
    }
    const bioSpent=sumObj(b.bio);
    currency=Math.max(0,currency+(total-before))-bioSpent;
    const rpBefore=rp;
    rp=Math.min(10,rp+1);
    const rpSpent=sumObj(b.rp);
    rp=rp-rpSpent;
    if(b.result==='W')wins++;
    supplySpent+=n((b.rp||{}).supply); swarmSpent+=n((b.bio||{}).swarm);
    const supply=n(state.force.startSupply)+Math.floor(supplySpent/2)*200+Math.floor(swarmSpent/2)*100;
    rows.push({resBio,kaBio,gained,total,bp,stageAt,completed,bioSpent,currency,rpSpent,rp,supply,stageBPafter:stageBP});
  });
  const supply=n(state.force.startSupply)+Math.floor(supplySpent/2)*200+Math.floor(swarmSpent/2)*100;
  const used=state.units.reduce((a,u)=>a+n(u.pts),0);
  const totalBioSpent=state.battles.reduce((a,b)=>a+sumObj(b.bio),0);
  const totalRPSpent=state.battles.reduce((a,b)=>a+sumObj(b.rp),0);
  return {rows,total,worldTotal,currency,rp,stage,stageBP,wins,battles:state.battles.length,bpTotal,supply,used,totalBioSpent,totalRPSpent};
}
function rankOf(u){
  if(u.epic) return 4; // Epic Heroes count as Legendary
  const xp=n(u.xp);
  let r=0; RANKS.forEach((R,i)=>{if(xp>=R[1])r=i});
  if(!u.character && !u.legendaryVet && r>2) r=2;
  return r;
}
function maxHonours(u){return (u.character||u.legendaryVet)?6:3}
function honourCP(h,u){
  if(h.type==='CR'){return h.tier==='Legendary'?3:(h.tier==='Antiquity'?2:1)}
  return u.titanic?2:1;
}
function unitCP(u){
  if(u.epic) return null;
  return u.honours.reduce((a,h)=>a+honourCP(h,u),0)-u.scars.length+n(u.cpAdj);
}
function badgeStatus(){
  const c=calc();
  const dev=(state.devoured||[]).slice(); if(c.stage>=3) dev.push(state.world.type);
  const types=new Set(dev).size;
  const legendary=state.units.some(u=>u.character&&!u.epic&&n(u.xp)>=51);
  const crown=state.units.some(u=>u.honours.some(h=>h.type==='CR'&&/norn crown/i.test(h.name)));
  return [
    {name:'Vanguard Tendril',desc:'Devour one world and win two battles.',req:[['Worlds devoured',dev.length,1],['Victories',c.wins,2]]},
    {name:'Monstrous Tendril',desc:'Devour three different world types and win six battles.',req:[['World types devoured',types,3],['Victories',c.wins,6]]},
    {name:'All-Consuming Tendril',desc:'Devour five worlds of every type, win ten battles, have a Legendary Character and The Norn Crown.',req:[['Worlds devoured',dev.length,5],['World types',types,3],['Victories',c.wins,10],['Legendary Character',legendary?1:0,1],['The Norn Crown',crown?1:0,1]]},
  ].map(b=>Object.assign(b,{earned:b.req.every(r=>r[1]>=r[2])}));
}
function badgeSvg(i){
  const field=['#a65f2a','#7c7f8a','#b9892c'][i];
  const k=i+1; let t='';
  for(let j=0;j<k;j++){
    const rot=(k===1?-25:0)+j*360/k;
    t+=`<path transform="rotate(${rot} 50 50)" d="M50 54 C44 38 52 20 72 14 C64 24 61 33 63 43 C57 40 53 46 50 54 Z"/><path transform="rotate(${rot} 50 50)" d="M58 30 L64 25 L62 33 Z"/>`;
  }
  return `<svg class="cbadge-svg" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#d9ccae"/><circle cx="50" cy="50" r="48" fill="none" stroke="#2b2219" stroke-opacity=".35" stroke-width="1.5"/><circle cx="50" cy="50" r="39" fill="${field}"/><circle cx="50" cy="50" r="39" fill="none" stroke="#2b2219" stroke-opacity=".3" stroke-width="1.5"/><g fill="#efe5cd">${t}<circle cx="50" cy="52" r="7"/></g><circle cx="50" cy="52" r="3" fill="${field}"/></svg>`;
}
function badgesHtml(){
  return `<div class="cbadges">${badgeStatus().map((b,i)=>`<div class="cbadge ${b.earned?'earned':'locked'}">${badgeSvg(i)}<div><b>${b.name}</b><span class="st">${b.earned?'Earned':'Not yet earned'}</span><span class="desc">${b.desc}</span><ul>${b.req.map(r=>`<li class="${r[1]>=r[2]?'met':''}">${r[0]}: ${Math.min(r[1],r[2])}/${r[2]}</li>`).join('')}</ul></div></div>`).join('')}</div>`;
}
function hasKw(u,kw){
  const s=(u.type+', '+u.ds+(u.warlord?', Warlord':'')).toLowerCase();
  return s.includes(kw.toLowerCase());
}

/* =========================================================
   HELPERS
   ========================================================= */
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function inp(path,val,type='text',attrs=''){
  if(type==='num') return `<input type="number" data-bind="${path}" data-type="num" value="${esc(val)}" ${attrs}>`;
  if(type==='date') return `<input type="date" data-bind="${path}" value="${esc(val)}" ${attrs}>`;
  return `<input type="text" data-bind="${path}" value="${esc(val)}" ${attrs}>`;
}
function chk(path,val,attrs=''){return `<input type="checkbox" data-bind="${path}" data-type="bool" ${val?'checked':''} ${attrs}>`}
function getPath(path){return path.split('.').reduce((o,k)=>o==null?undefined:o[k],state)}
function setPath(path,val){
  const ks=path.split('.'); let o=state;
  for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]]}
  o[ks[ks.length-1]]=val;
}
const pageHead=(title,sub,extra='')=>`<div class="page-head"><div><h1>${title}</h1>${sub?`<p class="muted">${sub}</p>`:''}</div>${extra}</div>`;
const fmtSigned=v=>v>0?'+'+v:String(v);

/* =========================================================
   PAGES
   ========================================================= */
function pIntroduction(){
  const ad=state.settings.adaptation;
  const f=state.settings.stratFilter;
  const strats=STRATS.filter(s=>f==='all'||s.src===f);
  let phaseHtml='';
  PHASES.forEach(([k,label])=>{
    const list=strats.filter(s=>s.phases.includes(k));
    if(!list.length) return;
    phaseHtml+=`<div class="phase"><h3>${label}</h3><span class="muted small">${list.length} stratagem${list.length>1?'s':''}</span></div><div class="strats">${list.map(s=>stratCard(s,ad)).join('')}</div>`;
  });
  return pageHead('Introduction','Your army: Tyranids, Invasion Fleet detachment. Pick the Hyper-adaptation for the first battle round; the stratagem list below is sorted by the phase you play it in.')+`
  <section class="grid2">
    <div class="panel">
      <h3>Army rules</h3>
      <div class="rule"><h4>Synapse</h4><p>A <span class="kw">Tyranids</span> unit within 6" of a friendly <span class="kw">Synapse</span> model is within Synapse Range. Such units take Battle-shock tests on 3D6, and add 1 to the Strength of their melee attacks.</p></div>
      <div class="rule"><h4>Shadow in the Warp</h4><p>Once per battle, in either player’s Command phase: every enemy unit on the battlefield takes a Battle-shock test, at -1 if within 6" of one of your <span class="kw">Synapse</span> units.</p></div>
    </div>
    <div class="panel prose">
      <h3>How a detachment works</h3>
      <p><b>Detachment rule.</b> Applies to your whole army or to particular units. For Invasion Fleet: choose one Hyper-adaptation at the start of the first battle round.</p>
      <p><b>Enhancements.</b> Only <span class="kw">Characters</span> can take them. In Crusade you can also gain one through the Renowned Heroes Requisition.</p>
      <p><b>Stratagems.</b> There are Core stratagems and detachment stratagems. Each costs Command points (CP) and says when you can use it.</p>
    </div>
  </section>

  <h2>Detachment rule: Hyper-adaptations</h2>
  <p class="muted">At the start of the first battle round, select one; it is active for your <span class="kw">Tyranids</span> units until the end of the battle.</p>
  <div class="adapt" role="radiogroup" aria-label="Hyper-adaptation">
    ${Object.entries(ADAPTATIONS).map(([k,a])=>`<label><input type="radio" name="adapt" value="${k}" data-bind="settings.adaptation" ${ad===k?'checked':''}> <b>${a.name}</b> <span class="on">(active)</span><br><span class="small">${a.text}</span></label>`).join('')}
  </div>

  <h2>Enhancements</h2>
  <div class="grid2">${ENHANCEMENTS.map(e=>`<div class="rule"><h4>${e[0]} <span class="muted small">(${e[1]} pts)</span></h4><p>${e[2]}</p><p class="small muted">Tyranids model only.</p></div>`).join('')}</div>

  <div class="page-head" style="margin-top:28px"><div><h2 style="margin:0">Stratagems by phase</h2></div>
    <div class="filter" role="group" aria-label="Show stratagems">
      ${[['all','All'],['det','Invasion Fleet'],['core','Core']].map(([k,l])=>`<button type="button" data-action="stratFilter" data-val="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}
    </div></div>
  <p class="small muted">Colour stripe: <span style="color:var(--tactic)">Battle Tactic</span>, <span style="color:var(--ploy)">Strategic Ploy</span>, <span style="color:var(--deed)">Epic Deed</span>, <span style="color:var(--wargear)">Wargear</span>. Rapid Regeneration and Fire Overwatch appear in two phases.</p>
  ${phaseHtml}`;
}
function stratCard(s,ad){
  const turn={yours:'Your turn',theirs:'Opponent’s turn',either:'Either turn'}[s.turn];
  let restr=s.restr||'';
  if(s.name==='Predatory Imperative') restr=`Cannot pick ${ADAPTATIONS[ad].name}, your army’s active Hyper-adaptation.`;
  return `<article class="strat ${s.type} ${s.src==='core'?'core':''}">
    <header><div><h4>${s.name}</h4><div class="meta">${s.src==='core'?'Core':'Invasion Fleet'}, ${TYPE_NAMES[s.type]}. ${turn}</div></div><div class="cp">${s.cp}CP</div></header>
    <dl><dt>When</dt><dd>${s.when}</dd><dt>Target</dt><dd>${s.target}</dd><dt>Effect</dt><dd>${s.effect}</dd>${restr?`<dt>Limits</dt><dd>${restr}</dd>`:''}${s.rare?`<dt>Note</dt><dd class="muted">${s.rare} Rarely usable by Tyranids.</dd>`:''}</dl>
  </article>`;
}

function pCrusadeRules(){
  const c=calc(); const W=state.world; const T=W.targets;
  const stages=STAGE_NAMES.map((nm,i)=>{
    const done=c.stage>i, cur=c.stage===i;
    const bpNow=done?T[i].bp:(cur?c.stageBP:0);
    const bioPct=Math.min(100,c.worldTotal/Math.max(1,T[i].bio)*100);
    const bpPct=Math.min(100,bpNow/Math.max(1,T[i].bp)*100);
    return `<div class="stage ${done?'done':''} ${cur?'current':''}">
      <h4><span>Stage ${i+1}: ${nm}</span><span class="small ${done?'ok':(cur?'':'muted')}">${done?'Complete':(cur?'Current':'Locked')}</span></h4>
      <div class="small">Biomass ${c.worldTotal} / ${inp(`world.targets.${i}.bio`,T[i].bio,'num','aria-label="Biomass needed"')}</div>
      <div class="bar"><i style="width:${bioPct}%"></i></div>
      <div class="small">Battles Played ${bpNow} / ${inp(`world.targets.${i}.bp`,T[i].bp,'num','aria-label="Battles needed"')}</div>
      <div class="bar bp"><i style="width:${bpPct}%"></i></div>
    </div>`;
  }).join('');
  const worldTables=Object.entries(WORLD_TABLES).map(([nm,w])=>`
    <div class="panel" ${nm===W.type?'style="border:2px solid var(--chitin)"':''}>
      <h3>${nm} <span class="muted small">D6 ${w.d6}</span> ${nm===W.type?'<span class="tag cr">Your world</span>':''}</h3>
      <p class="small muted">${w.desc}</p>
      <table><thead><tr><th>Stage</th><th class="num">Biomass</th><th class="num">Battles Played</th></tr></thead>
      <tbody>${w.rows.map((r,i)=>`<tr class="${nm===W.type?'hl':''}"><td>${STAGE_NAMES[i]}</td><td class="num">${r[0]}</td><td class="num">${r[1]}</td></tr>`).join('')}</tbody></table>
    </div>`).join('');
  return pageHead('Crusade Rules','Tyranids devour one world at a time, in three stages. Your force is working on a Hive World.')+`
  <section class="panel">
    <div class="page-head" style="border:0;margin:0;padding:0"><div><h2 class="bio-t" style="margin-top:0">Your world: ${esc(W.type)}</h2>
      <p class="small muted">Rolled values: ${esc(W.rolls)}</p></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <label class="small">World type <select data-bind="world.type">${Object.keys(WORLD_TABLES).map(k=>`<option ${k===W.type?'selected':''}>${k}</option>`).join('')}</select></label>
        <button type="button" data-action="rollWorld" title="Roll a new world type and its stage targets">Roll a new world</button>
      </div></div>
    <p class="small">Biomass needed is cumulative (it carries over between stages); Battles Played resets for each stage. Current stage: <b>${c.stage>=3?'World devoured':STAGE_NAMES[c.stage]}</b>.</p>
    <div class="stages">${stages}</div>
    ${c.stage>=3?'<p class="ok">World devoured! Spend Biomass on Biogenesis, then roll a new world.</p>':''}
  </section>

  <h2>Playing a Crusade battle</h2>
  <ol class="seq prose">
    <li><b>Muster.</b> Choose units from your Order of Battle up to the battle size (Incursion 1000 pts). Include at least one <span class="kw">Character</span>, pick a Warlord, max three of the same datasheet (six for Battleline).</li>
    <li><b>Pre-battle requisitions.</b> Rearm and Resupply, Vanguard Adaptation, Infestation and similar are bought now.</li>
    <li><b>Select Agendas.</b> Choose your Agendas (An Intellect Vast and Cold adds one). Note Prey Targets if you take Hunt and Slay.</li>
    <li><b>Play the mission.</b> Track kills per unit, Prey Targets killed in the Fight phase, Tyrannoform markers.</li>
    <li><b>Out of Action.</b> For each destroyed unit roll a D6; on a 1 choose Devastating Blow (lose an Honour) or a Battle Scar.</li>
    <li><b>Experience.</b> Each unit: +1XP Battle Experience, +1XP per third kill (Dealers of Death), Agenda XP, stage bonus XP. One unit is Marked for Greatness (+3XP).</li>
    <li><b>Ranks and honours.</b> Promote units that crossed an XP threshold; each new rank gives a Battle Honour (or Renowned Heroes).</li>
    <li><b>Bookkeeping.</b> +1RP (max 10). Win +1 Biomass, loss -1 Biomass (min 0), plus Agenda Biomass. Add Battles Played. Spend RP and Biomass.</li>
  </ol>

  <h2 class="bio-t">Generating a world</h2>
  <p class="prose">Roll a D6 for world type, then roll the Invasion targets, then add the Predation roll to Invasion, and the Consumption roll to Predation. Biomass from earlier stages still counts toward later targets.</p>
  <div class="grid3">${worldTables}</div>

  <h2 class="bio-t">Earning Biomass</h2>
  <div class="panel prose"><p>Win a battle: +1 Biomass. Lose: -1 Biomass (never below 0). Agendas give more (see Agendas). Reaching a stage unlocks its Requisition, usable once per world.</p></div>

  <h2 class="bio-t">Devouring stages</h2>
  <div class="grid3">${STAGE_INFO.map((s,i)=>`<div class="panel"><h3>Stage ${i+1}: ${STAGE_NAMES[i]}</h3>
    <div class="rule"><h4>${s.req[0]} <span class="muted small">(${s.req[1]})</span></h4><p class="small">${s.req[2]}</p></div>
    <div class="rule"><h4>Battle Experience bonus</h4><p class="small">${s.xp}</p></div></div>`).join('')}</div>

  <h2 class="bio-t">Biogenesis</h2>
  <p class="prose">After completing Consumption, spend Biomass on these upgrades before generating a new world. Your spreadsheet tracks Biomass spending per battle on the Battle Tally page.</p>
  <div class="grid2">${BIOGENESIS.map(b=>`<div class="rule"><h4>${b.name} <span class="muted small">(${b.cost} Biomass)</span></h4><p class="small">${b.text}</p></div>`).join('')}</div>

  <h2>Requisitions</h2>
  <p class="prose small"><b>Consume to Survive:</b> if your force includes any Tyranids units, Increase Supply Limit costs 2RP. You start with 5RP, gain 1RP per battle, and can never hold more than 10.</p>
  <div class="scroll-x"><table><thead><tr><th>Requisition</th><th>Cost</th><th>Source</th><th>Summary</th></tr></thead><tbody>
  ${REQUISITIONS.map(r=>`<tr><td><b>${r.name}</b></td><td>${r.cost}</td><td class="small">${r.grp}</td><td class="small">${r.text}</td></tr>`).join('')}
  </tbody></table></div>

  <h2 class="bio-t">Crusade Badges</h2>
  <p class="prose small muted">Badges light up automatically once you meet every requirement. A world counts as devoured when you finish its Consumption stage.</p>
  <div class="panel">${badgesHtml()}</div>`;
}

function pBattleTally(){
  const c=calc(); const B=state.battles;
  const cols=B.map((b,i)=>i);
  const row=(label,cells,cls='')=>`<tr class="${cls} ${/Biomass|Bio each|Devouring/.test(label)?'bio':''}"><td>${label}</td>${cells}</tr>`;
  const cellsIn=(fn)=>cols.map(i=>`<td class="num">${fn(i)}</td>`).join('');
  let h='';
  h+=`<tr><th>Battle</th>${cols.map(i=>`<th class="num">#${i+1} <button type="button" class="ghost small" data-action="delBattle" data-i="${i}" title="Delete battle ${i+1}" aria-label="Delete battle ${i+1}" style="padding:0 6px">×</button></th>`).join('')}</tr>`;
  h+=row('Date',cellsIn(i=>inp(`battles.${i}.date`,B[i].date,'date')));
  h+=row('Opponent',cellsIn(i=>inp(`battles.${i}.opponent`,B[i].opponent,'text','style="width:7em"')));
  h+=row('Devouring stage',cellsIn(i=>STAGE_NAMES[c.rows[i].stageAt]||'Devoured'));
  h+=row('Result',cellsIn(i=>`<select data-bind="battles.${i}.result">${[['W','Win'],['L','Loss'],['D','Draw']].map(([k,l])=>`<option value="${k}" ${B[i].result===k?'selected':''}>${l}</option>`).join('')}</select>`));
  h+=`<tr class="sec bio"><td>Biomass earned</td>${cols.map(()=>'<td></td>').join('')}</tr>`;
  h+=row('Win / loss Biomass',cellsIn(i=>fmtSigned(c.rows[i].resBio)));
  h+=row('Prey Targets killed in the Fight phase',cellsIn(i=>inp(`battles.${i}.prey`,B[i].prey,'num')));
  h+=row('Prey Target Biomass <span class="cost">(1:0, 2–3:1, 4+:D3)</span>',cellsIn(i=>inp(`battles.${i}.preyBio`,B[i].preyBio,'num')));
  h+=row('Tyrannoform markers',cellsIn(i=>inp(`battles.${i}.tyr`,B[i].tyr,'num')));
  h+=row('Tyrannoform Biomass <span class="cost">(3:1, 4:D3, 5+:3)</span>',cellsIn(i=>inp(`battles.${i}.tyrBio`,B[i].tyrBio,'num')));
  h+=row('Infest the Prey World Biomass',cellsIn(i=>inp(`battles.${i}.infestBio`,B[i].infestBio,'num')));
  h+=row('Killed everyone (Tyranid Attack, +4)',cellsIn(i=>chk(`battles.${i}.killedAll`,B[i].killedAll,`aria-label="Battle ${i+1} killed everyone"`)));
  h+=row('Biomass gained this battle',cellsIn(i=>`<b>${fmtSigned(c.rows[i].gained)}</b>`),'calc');
  h+=row('Total Biomass acquired',cellsIn(i=>c.rows[i].total),'calc');
  h+=row('Battles Played points',cellsIn(i=>c.rows[i].bp),'calc');
  h+=`<tr class="sec bio"><td>Biomass spent (Biogenesis)</td>${cols.map(()=>'<td></td>').join('')}</tr>`;
  BIOGENESIS.forEach(bg=>{h+=row(`${bg.name} <span class="cost">(${bg.cost} Bio each)</span>`,cellsIn(i=>inp(`battles.${i}.bio.${bg.key}`,(B[i].bio||{})[bg.key]||0,'num',`step="${bg.cost}" min="0"`)))});
  h+=row('Total Biomass spent',cellsIn(i=>c.rows[i].bioSpent),'calc');
  h+=row('Biomass currency after',cellsIn(i=>`<b>${c.rows[i].currency}</b>`),'calc');
  h+=`<tr class="sec"><td>RP spent after the battle</td>${cols.map(()=>'<td></td>').join('')}</tr>`;
  REQUISITIONS.forEach(r=>{h+=row(`${r.name} <span class="cost">(${r.cost})</span>`,cellsIn(i=>inp(`battles.${i}.rp.${r.key}`,(B[i].rp||{})[r.key]||0,'num',`min="0" ${r.fixed?`step="${r.fixed}"`:''}`)))});
  h+=row('Total RP spent',cellsIn(i=>c.rows[i].rpSpent),'calc');
  h+=row('RP after (+1 per battle, max 10)',cellsIn(i=>`<b>${c.rows[i].rp}</b>`),'calc');
  h+=row('Supply Limit for next battle',cellsIn(i=>c.rows[i].supply),'calc');
  h+=row('Notes',cellsIn(i=>inp(`battles.${i}.notes`,B[i].notes,'text','style="width:7em"')));

  return pageHead('Battle Tally','One column per battle. Biomass, RP and Supply Limit are calculated from what you enter.',`<button type="button" class="primary" data-action="addBattle">Add battle</button>`)+`
  <div class="bignums">
    <div><b>${c.battles}</b><span>Battles played</span></div>
    <div><b>${c.wins}</b><span>Victories</span></div>
    <div class="bio"><b>${c.total}</b><span>Total Biomass acquired</span></div>
    <div class="bio"><b>${c.totalBioSpent}</b><span>Biomass spent</span></div>
    <div class="bio"><b>${c.currency}</b><span>Biomass available</span></div>
    <div><b>${c.totalRPSpent}</b><span>RP spent</span></div>
    <div><b>${c.rp}</b><span>RP available</span></div>
    <div><b>${c.supply}</b><span>Supply Limit</span></div>
  </div>
  <div class="panel small" style="display:flex;gap:18px;flex-wrap:wrap;align-items:center">
    <label>Starting RP ${inp('force.startRP',state.force.startRP,'num')}</label>
    <label>Starting Supply Limit ${inp('force.startSupply',state.force.startSupply,'num','style="width:6em"')}</label>
    <span class="muted">Battles Played points this world: ${c.bpTotal}. Stage: ${c.stage>=3?'World devoured':STAGE_NAMES[c.stage]} (${c.stageBP} Battles Played in stage).</span>
  </div>
  <div class="scroll-x panel" data-keep-scroll="tally" style="padding:0"><table class="tally">${h}</table></div>
  <p class="note">Spend columns follow the spreadsheet: enter the amount spent, not the number of purchases. Increase Supply Limit adds 200 per 2RP; The Swarm Grows adds 100 per 2 Biomass.</p>`;
}

function pAgendas(){
  const B=state.battles;
  const usedPrey=B.reduce((a,b)=>a+n(b.prey),0), usedTyr=B.reduce((a,b)=>a+n(b.tyr),0), ka=B.filter(b=>b.killedAll).length, inf=B.reduce((a,b)=>a+n(b.infestBio),0);
  const counts=[`${inf} Biomass earned so far`,`${usedPrey} Prey Targets killed so far`,`${usedTyr} markers placed so far`,`Achieved ${ka} time${ka===1?'':'s'}`];
  return pageHead('Agendas','Tyranids Agendas you can select in the Select Agendas step, alongside the mission pack’s own Agendas.')+`
  <div class="grid2">${AGENDAS.map((a,i)=>`<section class="panel"><h3>${a.name}</h3><p>${a.text}</p>
    ${a.table?`<table style="max-width:360px"><thead><tr><th>${a.table[0][0]}</th><th class="num">${a.table[0][1]}</th></tr></thead><tbody>${a.table.slice(1).map(r=>`<tr><td>${r[0]}</td><td class="num">${r[1]}</td></tr>`).join('')}</tbody></table>`:''}
    <p class="small ok" style="margin-top:10px">Your campaign: ${counts[i]}.</p></section>`).join('')}</div>
  <div class="panel prose"><h3>Extra Agenda</h3><p>The <b>An Intellect Vast and Cold</b> Requisition (1RP) lets you pick one additional Agenda for a battle, as long as at least one of your Agendas is a Tyranids Agenda.</p>
  <p class="small muted">Hunt and Slay and Tyrannoform the Prey World XP go on the unit’s Crusade card (Prey Targets killed, Spores planted).</p></div>`;
}

function pOrderOfBattle(){
  const c=calc(); const F=state.force;
  const units=state.units;
  const slots=[];
  for(let i=0;i<Math.max(24,units.length+ (units.length%2)) ;i++) slots.push(units[i]||null);
  const half=Math.ceil(slots.length/2);
  const slotHtml=(u)=>u?`<div class="slot${u.character?' char':''}${u.epic?' epic':''}"${u.character?` title="${u.epic?'Epic Hero':'Character'}"`:''}><div><span class="nm">${esc(u.name)}${hasKw(u,'Synapse')&&!u.scars.some(sc=>/lobe impairment/i.test(sc))?'<span class="syn-kw">Synapse</span>':''}</span><span class="ds">${esc(u.ds)}${u.models>1?`, ${u.models} models`:''}${u.warlord?', Warlord':''}</span></div><div>${u.pts}</div><div>${u.epic?'N/A':unitCP(u)}</div></div>`

      <td><button type="button" class="danger small" data-action="delUnit" data-i="${i}" aria-label="Remove ${esc(u.name)}" style="padding:2px 8px">Remove</button></td>
    </tr>`;

  const qr=state.quickref.map(r=>`<tr>${r.map((c,j)=>j===1?`<td><b>${esc(c)}</b></td>`:`<td class="small">${esc(c)}</td>`).join('')}</tr>`).join('');

  return pageHead('Order of Battle','Every unit in your Crusade force, with campaign totals pulled from the Battle Tally.')+`
  <section class="sheet" aria-label="Order of Battle sheet">
    <div class="row1">
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="box"><div class="val"><input type="text" data-bind="force.name" value="${esc(F.name)}" aria-label="Crusade force name"></div><span class="lbl">Crusade force</span></div>

        </div>
      </div>
      <svg class="glyph" viewBox="0 0 120 120" role="img" aria-label="Crossed swords"><defs><g id="oobSword"><path d="M60 2 L67 13 L66.5 80 L53.5 80 L53 13 Z"/><path d="M60 15 V76" stroke="var(--paper)" stroke-width="2" stroke-linecap="round"/><path d="M36 80 C43 78 50 79 60 79 C70 79 77 78 84 80 L86 87 C77 85 70 86 60 86 C50 86 43 85 34 87 Z"/><path d="M56.5 86 H63.5 V105 H56.5 Z"/><path d="M58 89 H62 M58 94 H62 M58 99 H62" stroke="var(--paper)" stroke-width="1.6"/><circle cx="60" cy="110.5" r="6.5"/></g></defs><use href="#oobSword" fill="currentColor" transform="rotate(-42 60 60)"/><use href="#oobSword" fill="currentColor" stroke="var(--paper)" stroke-width="3" paint-order="stroke" transform="rotate(42 60 60)"/></svg>
      <div class="dials">
        <div class="dial"><b>${c.battles}</b><span>Battle tally</span></div>

        <div class="dial"><b>${c.rp}</b><span>Requisition points (RP)</span></div>
        <div class="dial bio"><b>${c.currency}</b><span>Current biomass</span></div>
      </div>
    </div>
    <div class="row2">
      <div class="box bio"><div class="val">${c.total}</div><span class="lbl">Total biomass acquired</span></div>
      <div class="box bio"><div class="val">${c.totalBioSpent}</div><span class="lbl">Total biomass spent</span></div>
      <div class="box"><div class="val">${c.totalRPSpent} <span style="font-size:.9rem;font-weight:500">of ${n(F.startRP)+c.battles} earned</span></div><span class="lbl">Total RP spent</span></div>
      <div class="box stagebox bio"><div class="val">${esc(state.world.type)}: ${stageTxt}</div><span class="lbl">Devouring ${stageNeed?`(${stageNeed})`:''}</span></div>
    </div>
    <details class="badgebox" ${state.settings.badgesOpen?'open':''}><summary><span class="bsum-title">Crusade badges</span><span class="bmini">${badgeStatus().map((b,i)=>`<span class="mini ${b.earned?'earned':'locked'}" title="${b.name}: ${b.earned?'earned':'not yet earned'}">${badgeSvg(i)}</span>`).join('')}</span><span class="bcount">${badgeStatus().filter(b=>b.earned).length} of 3 earned</span><span class="bchev" aria-hidden="true"></span></summary>${badgesHtml()}</details>
    <div class="oob">${col(slots.slice(0,half))}${col(slots.slice(half))}
      <div class="achv"><h4>Record of achievement</h4><textarea data-bind="force.achievements" aria-label="Record of achievement">${esc(F.achievements)}</textarea></div>
    </div>
    <div class="sheet-foot"><span>Supply left: ${c.supply-c.used} pts</span><span>Crusade points total: ${units.reduce((a,u)=>a+(u.epic?0:unitCP(u)),0)}</span><span>Subject: Order of Battle</span></div>
  </section>

  <h2>Roster and army lists</h2>
  <p class="prose muted">Tick units for each army list (Incursion, 1000 points). Crusade points are calculated from honours and scars on the Crusade Cards.</p>
  <div class="listsum">${lists}</div>
  <div class="scroll-x panel" style="padding:0"><table class="roster">
    <thead><tr><th>Unit name</th><th>Datasheet</th><th class="num">Models</th><th class="num">Points</th><th class="num">CP</th><th class="num">XP</th><th>Rank</th><th class="num">Honours</th><th class="num">Scars</th><th class="num">Char.</th>${state.lists.map((L,li)=>`<th class="listcol">${esc(L.name)}</th>`).join('')}<th></th></tr></thead>
    <tbody>${roster}</tbody></table></div>

  <section class="panel" id="addUnit">
    <h3>Add a Tyranids unit</h3>
    <div class="addform">
      <label>Datasheet<select id="addDs">${TYRANID_DATASHEETS.slice().sort().map(d=>`<option>${esc(d)}</option>`).join('')}</select></label>

      <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="addChar"> Character</label>
      <label style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="addEpic"> Epic Hero</label>
      <button type="button" class="primary" data-action="addUnit">Add to Order of Battle</button>
    </div>
    <p class="small muted" id="addMsg">Supply left: ${c.supply-c.used} pts. A Crusade card is created for the new unit automatically.</p>
  </section>

  <h2>Phase cheat sheet</h2>
  <div class="scroll-x panel" style="padding:0"><table><thead><tr><th>Pre-game</th><th>Unit</th><th>Command</th><th>Move</th><th>Aura</th><th>Shooting</th><th>Charge (2D6)</th><th>Fight</th></tr></thead><tbody>${qr}</tbody></table></div>
  <h3>Toughness and weapon Strength</h3>
  <div class="scroll-x panel" style="padding:0;max-width:560px"><table><thead><tr><th>Unit</th><th class="num">T</th><th>Weapon S</th></tr></thead><tbody>${sr}</tbody></table></div>`;
}

function rankBanner(u){
  const r=rankOf(u); if(r===null||r<1) return '';
  const names=['','Blooded','Battle-hardened','Heroic','Legendary'];
  const sword=(blade,dark)=>`<path d="M30 20 L34 26 L34 64 L26 64 L26 26 Z" fill="${blade}"/><path d="M30 28 V60" stroke="${dark}" stroke-width="1.2" opacity=".5"/><path d="M19 63 H41 V68 H19 Z" fill="${blade}"/><path d="M28 68 H32 V78 H28 Z" fill="${dark}"/><circle cx="30" cy="81" r="3.2" fill="${blade}"/>`;
  const cross=(c)=>`<path d="M21 22 H39 L35 40 L49 36.5 V53.5 L35 50 L39 72 H21 L25 50 L11 53.5 V36.5 L25 40 Z" fill="${c}"/>`;
  const skull=(c)=>`<path d="M30 37 C35 37 38.5 40.5 38.5 45 C38.5 48 37 50 35 51 V54 H25 V51 C23 50 21.5 48 21.5 45 C21.5 40.5 25 37 30 37 Z" fill="${c}"/><circle cx="26.8" cy="45" r="2.3" fill="#1c1420"/><circle cx="33.2" cy="45" r="2.3" fill="#1c1420"/><path d="M29 48.5 L30 50.5 L31 48.5 Z" fill="#1c1420"/><path d="M27 54 V51.5 M30 54 V51.5 M33 54 V51.5" stroke="#1c1420" stroke-width=".8"/>`;
  let star='';
  if(r>=4){let pts=[];for(let k=0;k<24;k++){const a=k*Math.PI/12-Math.PI/2;const rad=k%2?9:22;pts.push((30+rad*Math.cos(a)).toFixed(1)+' '+(46+rad*Math.sin(a)).toFixed(1))}star=`<path d="M${pts.join(' L')} Z" fill="#c4262e"/>`}
  let emb='';
  if(r===1) emb=sword('#a3a8ae','#4c5157');
  if(r===2) emb=cross('#2f63b9')+sword('#d3d7dd','#5c6168');
  if(r===3) emb=sword('#d3d7dd','#5c6168')+skull('#f6f3ec');
  if(r>=4) emb=sword('#dcae32','#7a5a12')+skull('#f6f3ec');
  const fab=r===3?'#5b1f86':(r>=4?'#a11c24':'#241a29');
  const cloth=r>=4
    ? `<path d="M6 5 H54 V76 L51 84 L54 91 L47 89 L45 100 L40 90 L35 97 L31 87 L26 99 L22 88 L17 95 L14 86 L9 98 L8 85 L6 80 Z" fill="${fab}"/><path d="M51 8 V74 M9 8 V80 M9 8 H51" fill="none" stroke="#d4a84e" stroke-width="1.4"/>`
    : `<path d="M6 5 H54 V100 L30 88 L6 100 Z" fill="${fab}"/><path d="M9 8 H51 V95 L30 84.5 L9 95 Z" fill="none" stroke="#b08d4a" stroke-width="1.4"/>`;
  return `<svg class="rank-banner" viewBox="0 0 60 104" role="img" aria-label="${names[Math.min(r,4)]} rank"><title>${names[Math.min(r,4)]}</title>
    <rect x="2" y="1" width="56" height="4" rx="2" fill="#6b5640"/><circle cx="3" cy="3" r="3" fill="#8a7152"/><circle cx="57" cy="3" r="3" fill="#8a7152"/>
    ${cloth}
    ${emb}</svg>`;
}

function drawAuras(){
  const svg=document.getElementById('depsvg'); if(!svg) return; const layer=svg.getElementById('auralayer'); if(!layer) return;
  const D=depState(); const byU={}; svg.querySelectorAll('.tok').forEach(g=>{const G=tokGeom(g);if(!inTray(G))(byU[g.dataset.uid]=byU[g.dataset.uid]||[]).push(G)});
  let html=''; let ci=0;
  state.units.forEach(u=>{
    const geos=byU[u.id]; if(!geos) return; const sel=depSel&&depSel.uid===u.id;
    unitAuras(u).forEach(a=>{
      const show=sel||(a.syn?D.allSyn:D.allAuras); if(!show) return;
      const col=a.syn?'var(--syn)':AURA_COLORS[(ci++)%AURA_COLORS.length];
      const shapes=geos.map(G=>`<ellipse cx="${G.x}" cy="${G.y}" rx="${G.a+a.r}" ry="${G.b+a.r}" transform="rotate(${G.r} ${G.x} ${G.y})"/>`).join('');
      const top=Math.min(...geos.map(G=>G.y-Math.max(G.a,G.b)-a.r)); const cx=geos.reduce((s,G)=>s+G.x,0)/geos.length;
      html+=`<g class="aura${a.dash?' dash':''}" style="fill:${col};stroke:${col}"><g class="af">${shapes}</g>${geos.length===1?`<g class="ao">${shapes}</g>`:''}<text class="alabel" x="${cx<12?0.5:cx>32?43.5:cx}" y="${Math.max(1.2,top+1.2)}" text-anchor="${cx<12?'start':cx>32?'end':'middle'}" style="fill:${col}">${esc(u.name)}: ${esc(a.name)} ${a.r}"</text></g>`;
    });
  });

function infiltrateOk(G){const D=depState();const enemy=zonePolys(D.layout,'B',D.flip);return basePts(G).every(([x,y])=>x>=0&&x<=44&&y>=0&&y<=60&&!enemy.some(p=>inPoly(x,y,p))&&nearestOnPolys(x,y,enemy).d>9)}
function ruinRects(){
  const D=depState(); const T=TERRAIN[D.terrain||'none']; if(!T||!T.half) return [];
  const all=[...T.half,...T.half.map(t=>[t[0],60-t[1],44-t[2],t[3],t[4],t[5]])];
  return all.filter(t=>t[0]==='ruin').map(t=>{const [x,y]=toP([t[1],t[2]],D.flip);return {x,y,w:t[3],h:t[4],rot:((t[5]||0)-90+(D.flip?180:0))*Math.PI/180}});
}
function canEnterRuins(uid){const u=state.units.find(x=>x.id===uid);return !!u&&(hasKw(u,'Infantry')||hasKw(u,'Beast')||hasKw(u,'Swarm'))}
function inRuinBlocked(g,G){
  if(canEnterRuins(g.dataset.uid)) return false;
  const rects=ruinRects(); if(!rects.length) return false;
  const pts=[[G.x,G.y],...basePts(G,24)]; const rr=G.r*Math.PI/180;
  return rects.some(R=>{
    const inR=([px,py])=>{const dx=px-R.x,dy=py-R.y;const lx=dx*Math.cos(-R.rot)-dy*Math.sin(-R.rot),ly=dx*Math.sin(-R.rot)+dy*Math.cos(-R.rot);return Math.abs(lx)<=R.w/2&&Math.abs(ly)<=R.h/2};
    if(pts.some(inR)) return true;
    const corners=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([sx,sy])=>{const lx=sx*R.w/2,ly=sy*R.h/2;return [R.x+lx*Math.cos(R.rot)-ly*Math.sin(R.rot),R.y+lx*Math.sin(R.rot)+ly*Math.cos(R.rot)]});
    return corners.some(([px,py])=>{const dx=px-G.x,dy=py-G.y;const lx=dx*Math.cos(-rr)-dy*Math.sin(-rr),ly=dx*Math.sin(-rr)+dy*Math.cos(-rr);return (lx*lx)/(G.a*G.a)+(ly*ly)/(G.b*G.b)<=1});
  });
}
function placeReason(g){const G=tokGeom(g);if(inTray(G))return '';if(overlapsAny(g))return 'overlap';if(inRuinBlocked(g,G))return 'ruin';if(G.y+G.b<=60&&baseInZone(G))return '';if(unitInfiltrates(g.dataset.uid)&&infiltrateOk(G))return '';return unitInfiltrates(g.dataset.uid)?'infil':'zone'}
const PLACE_MSG={overlap:'Bases cannot overlap: move the model to a free spot.',ruin:'Only Infantry (and Beasts or Swarms) can be set up inside a ruin. Monsters must stay outside the footprint.',infil:'Infiltrators: set up wholly on the table and more than 9" from the enemy deployment zone, or inside your own zone.',zone:'Models can only be placed wholly inside your deployment zone (or back in the tray).'};
function placeOk(g){return placeReason(g)===''}
function drawInf(g){const svg=document.getElementById('depsvg');if(!svg)return;const layer=svg.getElementById('inflayer');if(!layer)return;layer.innerHTML='';if(!g||!unitInfiltrates(g.dataset.uid))return;const D=depState();
  layer.innerHTML=zonePolys(D.layout,'B',D.flip).map(p=>`<polygon class="infx" points="${p.map(q=>q.join(',')).join(' ')}"/>`).join('')+`<text class="inflbl" x="22" y="${D.flip?58.6:1.8}" text-anchor="middle">Infiltrators: stay more than 9" from the enemy deployment zone</text>`}
function radiusDir(G,ang){const phi=ang-G.r*Math.PI/180;const a=G.a,b=G.b;return a*b/Math.sqrt((b*Math.cos(phi))**2+(a*Math.sin(phi))**2)}
function edgeDist(A,B){const dx=B.x-A.x,dy=B.y-A.y;const d=Math.hypot(dx,dy);const ang=Math.atan2(dy,dx);return d-radiusDir(A,ang)-radiusDir(B,ang+Math.PI)}
function placeZoneLabels(){
  const svg=document.getElementById('depsvg'); if(!svg||!svg.getScreenCTM()) return; const D=depState();
  const inv=svg.getScreenCTM().inverse(); const pt=svg.createSVGPoint();
  const toSvg=(x,y)=>{pt.x=x;pt.y=y;const p=pt.matrixTransform(inv);return [p.x,p.y]};
  const boxes=[...svg.querySelectorAll('.tok, .obj .ob, .obj .odt, .obj .odzt, .obj .odl, .obj .odz, .terrain rect, .terrain circle')].map(el=>{const r=el.getBoundingClientRect();if(!r.width&&!r.height)return null;const a=toSvg(r.left,r.top),b=toSvg(r.right,r.bottom);return [Math.min(a[0],b[0]),Math.min(a[1],b[1]),Math.max(a[0],b[0]),Math.max(a[1],b[1])]}).filter(Boolean);
  [['zla','A'],['zlb','B']].forEach(([cls,which])=>{
    const t=svg.querySelector('.zl.'+cls); if(!t) return; const polys=zonePolys(D.layout,which,D.flip); if(!polys.length) return;
    const poly=polys[0]; let cx=0,cy=0; poly.forEach(p=>{cx+=p[0];cy+=p[1]}); cx/=poly.length; cy/=poly.length;
    t.setAttribute('x',cx); t.setAttribute('y',cy); const bb=t.getBBox(); const w=bb.width+0.6, h=bb.height+0.3; const asc=cy-bb.y;
    const free=(x,y)=>{const x0=x-w/2,x1=x+w/2,y0=y-asc-0.15,y1=y0+h;
      if(![[x0,y0],[x1,y0],[x1,y1],[x0,y1],[x,y0],[x,y1]].every(([px,py])=>polys.some(p=>inPoly(px,py,p))))return false;
      return !boxes.some(b=>b[0]<x1&&b[2]>x0&&b[1]<y1&&b[3]>y0)};
    if(free(cx,cy)) return;
    let best=null;
    for(let y=0.5;y<=60;y+=0.75)for(let x=0.5;x<=43.5;x+=0.75){if(!free(x,y))continue;const d=(x-cx)**2+(y-cy)**2;if(!best||d<best.d)best={x,y,d}}
    if(best){t.setAttribute('x',best.x.toFixed(2));t.setAttribute('y',best.y.toFixed(2))}
  });
}
function depCoherency(){
  const svg=document.getElementById('depsvg'); if(!svg) return;
  const byU={}; svg.querySelectorAll('.tok').forEach(g=>{g.classList.remove('incoh','badpos');const key=attachedGroup(g.dataset.uid).join('+');(byU[key]=byU[key]||[]).push(g)});
  let bad=0;
  Object.values(byU).forEach(gs=>{
    const on=gs.filter(g=>!inTray(tokGeom(g))); if(on.length<2) return;
    const need=gs.length>=7?2:1; const geo=on.map(tokGeom);
    on.forEach((g,i)=>{let k=0;geo.forEach((o,j)=>{if(i!==j&&edgeDist(geo[i],o)<=2.0001)k++});if(k<need){g.classList.add('incoh');bad++}});
  });
  svg.querySelectorAll('.tok').forEach(g=>{if(!placeOk(g))g.classList.add('badpos')});
  objDistUpdate(); drawAuras(); placeZoneLabels();
  const msg=document.getElementById('depmsg'); if(msg) msg.textContent=bad?`${bad} model${bad>1?'s are':' is'} out of unit coherency (shown in red).`:'';
}
function depFlash(t){const m=document.getElementById('depmsg');if(m){m.textContent=t;m.classList.add('warn');setTimeout(()=>{m.classList.remove('warn');depCoherency()},2500)}}
function depSelect(g){document.querySelectorAll('#depsvg .tok.sel').forEach(x=>x.classList.remove('sel'));depSel=g?{uid:g.dataset.uid,mi:g.dataset.mi}:null;if(g)g.classList.add('sel');drawRanges(g);drawAuras();drawInf(g)}
function depRotate(deg){
  if(!depSel) return depFlash('Select an oval base first (click it).');
  const g=document.querySelector(`#depsvg .tok[data-uid="${depSel.uid}"][data-mi="${depSel.mi}"]`); if(!g) return;
  if(g.dataset.w===g.dataset.h) return depFlash('Round bases do not need rotating.');
  const t=readTf(g); setTf(g,t[0],t[1],((t[2]+deg)%360+360)%360);
  if(!placeOk(g)){const why=placeReason(g);setTf(g,t[0],t[1],t[2]);return depFlash(why==='overlap'?'That rotation would make the base overlap another model.':why==='ruin'?'That rotation would push the base into a ruin, which only Infantry can enter.':'That rotation would push the base outside your deployment zone.')}
  depCollect(); depCoherency(); drawRanges(g);
}
/* auto-deploy a whole unit (or attached unit) in coherency when its first model leaves the tray */
function cohOk(gs){const geo=gs.map(tokGeom);const need=gs.length>=7?2:1;return geo.every((G,i)=>geo.filter((o,j)=>j!==i&&edgeDist(G,o)<=2.0001).length>=need)}
function autoPlaceGroup(gs,cx,cy,lead){
  const orig=gs.map(g=>readTf(g)); const n=gs.length;
  const cell=Math.max(...gs.map(g=>Math.max(+g.dataset.w,+g.dataset.h)))+0.45;
  const order=[lead,...gs.filter(g=>g!==lead)];
  const colsOpts=[];for(let c=Math.max(2,Math.ceil(Math.sqrt(n)));c<=Math.min(n,8);c++)colsOpts.push(c);
  if(n===2) colsOpts.unshift(2);
  const tryAt=(cols,ox,oy)=>{
    const rows=Math.ceil(n/cols);
    order.forEach((g,i)=>{const c=i%cols,r=Math.floor(i/cols);const inRow=r===rows-1?n-cols*(rows-1):cols;const x0=cx+ox-(inRow-1)*cell/2;setTf(g,x0+c*cell,cy+oy-(rows-1)*cell/2+r*cell,0)});
    return order.every(g=>{const G=tokGeom(g);return !inTray(G)&&placeOk(g)})&&cohOk(order);
  };
  for(let rad=0;rad<=18;rad+=0.5){
    const steps=rad===0?1:Math.max(8,Math.round(rad*5));
    for(let k=0;k<steps;k++){const a=k/steps*2*Math.PI;const ox=rad*Math.cos(a),oy=rad*Math.sin(a);
      for(const cols of colsOpts){ if(tryAt(cols,ox,oy)) return true; }
    }
  }
  gs.forEach((g,i)=>setTf(g,orig[i][0],orig[i][1],orig[i][2])); return false;
}
const MAIN=document.getElementById('main');
MAIN.addEventListener('pointerdown',e=>{
  const g=e.target.closest&&e.target.closest('#depsvg .tok'); if(!g){ if(e.target.closest&&e.target.closest('#depsvg')) depSelect(null); return; }
  const svg=g.ownerSVGElement; const p=svgPt(svg,e); e.preventDefault();
  const D0=depState(); const onTable=x=>!inTray(tokGeom(x));
  let group=[g];
  if(g.classList.contains('tok')){
    const uids=attachedGroup(g.dataset.uid); const attached=uids.length>1;
    if(D0.mode==='unit'){
      const sel=uids.map(id=>`.tok[data-uid="${id}"]`).join(',');
      group=[...svg.querySelectorAll(sel)].filter(x=>x===g||(D0.mode==='unit'&&x.dataset.uid===g.dataset.uid)||(onTable(g)?onTable(x):x.dataset.uid===g.dataset.uid));
    }
  }
  depDrag={svg,start:p,items:group.map(x=>({g:x,t:readTf(x)})),id:e.pointerId,moved:false,first:g};
  group.forEach(x=>x.classList.add('dragging')); drawInf(g); g.setPointerCapture&&g.setPointerCapture(e.pointerId);
  const tip=document.getElementById('kwtip'); if(tip) tip.style.display='none';
});
MAIN.addEventListener('pointermove',e=>{
  if(!depDrag) return; const p=svgPt(depDrag.svg,e); const dx=p.x-depDrag.start.x, dy=p.y-depDrag.start.y;
  if(!depDrag.moved&&Math.abs(dx)+Math.abs(dy)>0.05){depDrag.moved=true;drawRanges(null)}
  depDrag.items.forEach(it=>setTf(it.g,it.t[0]+dx,it.t[1]+dy,it.t[2]));
  const tip=document.getElementById('kwtip'); if(tip) tip.style.display='none';
  depCoherency();
  const f=depDrag.items[0]; const t=readTf(f.g); const rd=depDrag.svg.getElementById('depread');
  if(rd) rd.textContent=t[1]<=60?`${t[0].toFixed(1)}" from left, ${(60-t[1]).toFixed(1)}" from your edge`:'In tray';
});
const depEnd=()=>{
  if(!depDrag) return; const d=depDrag; depDrag=null;
  d.items.forEach(it=>it.g.classList.remove('dragging'));
  const rd=d.svg.getElementById('depread'); if(rd) rd.textContent='';
  if(!d.moved){ if(d.first.classList.contains('tok')) depSelect(d.first); return; }
  const tokens=d.items.filter(it=>it.g.classList.contains('tok'));
  // first model of a multi-model unit dragged out of the tray: deploy the whole (attached) unit in coherency
  if(tokens.length>=1&&tokens.every(it=>it.t[1]>62)&&d.first.classList.contains('tok')){
    const g=d.first, startInTray=true;
    if(startInTray&&!inTray(tokGeom(g))){
      const uids=attachedGroup(g.dataset.uid);
      const all=[...d.svg.querySelectorAll(uids.map(id=>`.tok[data-uid="${id}"]`).join(','))];
      const moving=new Set(tokens.map(it=>it.g)); const others=all.filter(x=>x!==g);
      if(others.length&&others.every(x=>moving.has(x)||inTray(tokGeom(x)))){
        const G=tokGeom(g);
        if(autoPlaceGroup(all,G.x,G.y,g)){depSelect(g);depCollect();depCoherency();return depFlash(`Whole unit deployed in coherency (${all.length} models). Drag single models to fine-tune.`)}
        d.items.forEach(it=>setTf(it.g,it.t[0],it.t[1],it.t[2])); depCoherency();
        return depFlash('The whole unit does not fit there in coherency. Try a more open spot in your deployment zone.');
      }
    }
  }
  if(tokens.length && !tokens.every(it=>placeOk(it.g))){
    const why=tokens.map(it=>placeReason(it.g)).find(Boolean)||'zone';
    d.items.forEach(it=>setTf(it.g,it.t[0],it.t[1],it.t[2])); depCoherency();
    return depFlash(PLACE_MSG[why]);
  }
  if(d.first.classList.contains('tok')) depSelect(d.first);
  depCollect(); depCoherency();
};

// ---------- dice ----------
function d6(){const a=new Uint32Array(1);crypto.getRandomValues(a);return 1+(a[0]%6)}
function rollExprR(e){e=String(e).replace(/\s/g,'').toUpperCase();if(e==='N/A'||e==='')return 0;let tot=0;e.split('+').forEach(part=>{const m=part.match(/^(\d*)D(\d)$/);if(m){for(let i=0;i<(+m[1]||1);i++)tot+=part.endsWith('D3')?Math.ceil(d6()/2):d6()}else tot+=Number(part)||0});return tot}

let bSaving=false,bPending=false;

  if(NET.code&&NET.ref){ if(bSaving){bPending=true;render();return} bSaving=true; try{await NET.ref.set(JSON.parse(JSON.stringify(BATTLE)))}catch(e){NET.status='Could not save to the shared game ('+(e&&e.code||'error')+'). You may only have view access.'} bSaving=false; if(bPending){bPending=false;return bCommit()} }

function bJoin(code){

  let first=true; const timer=setTimeout(()=>{if(first){NET.status='No answer from the shared store yet.';render()}},10000);
  NET.unsub=NET.ref.onSnapshot(snap=>{clearTimeout(timer);const d=snap.data();
    if(!d){ if(first){BATTLE=newBattle(code);first=false;NET.status='New game created. Share the code '+code+' with your opponent.';bCommit();return} }
    else { BATTLE=d; NET.status='Connected to game '+code+'.'; }

// ---------- attack resolution ----------
function woundTarget(S,T){S=+S;T=+T;if(S>=2*T)return 2;if(S>T)return 3;if(S===T)return 4;if(S*2<=T)return 6;return 5}
function resolveAttack(o){
  const w=o.weapon, tgt=o.target, kw=String(w.kw||'').toLowerCase(), out={lines:[],dmgEvents:[],mortal:0};
  const tkw=tgt.kw.map(k=>k.toLowerCase());
  let attacks=0; const blast=/blast/.test(kw)?Math.floor(tgt.left/5):0;
  for(let m=0;m<o.models;m++){attacks+=rollExprR(w.A)+blast}
  const rf=kw.match(/rapid fire (\d+)/); if(rf&&o.half) attacks+=Number(rf[1])*o.models;
  out.lines.push(`${attacks} attacks${blast?` (Blast +${blast} each)`:''}`);
  const torrent=/torrent/.test(kw); let sus=(kw.match(/sustained hits (\d+)/)||[])[1]; sus=sus?+sus:0; let lethal=/lethal hits/.test(kw);
  if(o.adapt==='swarming'&&(tkw.includes('infantry')||tkw.includes('swarm'))) sus=Math.max(sus,1);
  if(o.adapt==='aggression'&&(tkw.includes('monster')||tkw.includes('vehicle'))) lethal=true;
  if(o.sus) sus=Math.max(sus,+o.sus); if(o.lethal) lethal=true;
  let hitMod=Math.max(-1,Math.min(1,(o.hitMod||0)+(/heavy/.test(kw)&&o.still?1:0)));
  const bs=parseInt(w.SK)||7; let hits=0, autoW=0;
  if(torrent){hits=attacks;out.lines.push(`Torrent: ${hits} automatic hits`)}
  else{ let crits=0;
    for(let i=0;i<attacks;i++){let r=d6();const fail=x=>x===1||(x!==6&&x+hitMod<bs);
      if(fail(r)&&(o.rrHit==='all'||(o.rrHit==='1'&&r===1)))r=d6();
      if(r===6){crits++;if(lethal)autoW++;else hits++;hits+=sus}else if(!fail(r))hits++;}
    out.lines.push(`Hits: ${hits+autoW} (${crits} critical${sus?`, Sustained Hits ${sus}`:''}${lethal?', Lethal Hits':''})`);
  }
  let S=+w.S; let woundMod=Math.max(-1,Math.min(1,(o.woundMod||0)+(/lance/.test(kw)&&o.charged?1:0)));
  const need=woundTarget(S,tgt.T); const anti=kw.match(/anti-([a-z ]+?) (\d)\+/); const antiOn=anti&&tkw.some(k=>k.includes(anti[1].trim()))?+anti[2]:7;
  const twin=/twin-linked/.test(kw)||o.rrWound==='all'; const dev=/devastating wounds/.test(kw);
  let wounds=autoW, devW=0;
  for(let i=0;i<hits;i++){let r=d6();const crit=x=>x===6||x>=antiOn;const fail=x=>!crit(x)&&(x===1||x+woundMod<need);
    if(fail(r)&&(twin||(o.rrWound==='1'&&r===1)))r=d6();
    if(crit(r)&&dev)devW++;else if(!fail(r))wounds++;}
  out.lines.push(`Wounds: ${wounds+devW} (need ${need}+${antiOn<7?`, Anti ${antiOn}+`:''}${devW?`, ${devW} Devastating`:''})`);
  const ap=Number(w.AP)||0; const sv=parseInt(tgt.Sv)||7; const inv=parseInt(tgt.inv)||7;
  const coverOk=o.cover&&!/ignores cover/.test(kw)&&!(sv<=3&&ap===0);
  const armour=sv-ap-(coverOk?1:0); const saveNeed=Math.max(2,Math.min(armour,inv));
  let unsaved=0; for(let i=0;i<wounds;i++){const r=d6();if(r===1||r<saveNeed)unsaved++}
  out.lines.push(`Saves on ${saveNeed}+${coverOk?' (cover)':''}: ${wounds-unsaved} saved, ${unsaved} failed`);
  const meltaX=(kw.match(/melta (\d+)/)||[])[1];
  const dmg=()=>rollExprR(w.D)+(meltaX&&o.half?+meltaX:0);
  for(let i=0;i<unsaved;i++)out.dmgEvents.push(dmg());
  for(let i=0;i<devW;i++)out.mortal+=dmg();
  return out;
}
function applyDamage(tgt,events,mortal,fnp){
  const fnpN=parseInt(fnp)||7; let lost=0,ign=0; const before=tgt.left;
  const take=n=>{let real=0;for(let i=0;i<n;i++){if(d6()>=fnpN)ign++;else real++}return real};
  events.forEach(d=>{if(tgt.left<=0)return;const r=take(d);lost+=r;if(r>=tgt.wl){tgt.left--;tgt.wl=tgt.W}else tgt.wl-=r});
  let m=take(mortal);lost+=m;while(m>0&&tgt.left>0){if(m>=tgt.wl){m-=tgt.wl;tgt.left--;tgt.wl=tgt.W}else{tgt.wl-=m;m=0}}
  if(tgt.left<=0){tgt.left=0;tgt.dead=true}
  return {lost,ign,slain:before-tgt.left};
}

function crusadeTotal(side){const ids=BATTLE.units[side].map(u=>u.uid);if(side==='tyr')return state.units.filter(u=>ids.includes(u.id)).reduce((a,u)=>a+(u.epic?0:unitCP(u)),0);return umState().units.filter(u=>ids.includes(u.id)).reduce((a,u)=>a+(String(u.honours||'').split(',').filter(x=>x.trim()).length-String(u.scars||'').split(',').filter(x=>x.trim()).length),0)}

function unitRow(B,side,u,i){

// ---------- battle actions ----------
function bAction(a,b){
  const B=BATTLE; if(!B) return false;
  const side=b.dataset.side;
  switch(a){
    case 'bClaim': if(B.players[side]) return true; B.players[side]={id:NET.me||('guest-'+side)}; blog(`joined as the ${SIDES[side]}`,side); bCommit(); return true;
    case 'bLock': { if(!canAct(side)) return true; const li=+B.setup[side+'List']||0; B.units[side]=side==='tyr'?snapTyr(li):snapUm(li); B.setup.locked[side]=true; blog(`locked in ${(side==='tyr'?state.lists:umState().lists)[li].name}: ${B.units[side].length} units`,side); bCommit(); return true; }
    case 'bDraw': { const what=b.dataset.what; const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
      if(what==='primary')B.setup.primary=pick(LEV_PRIMARY); if(what==='rule')B.setup.rule=pick(LEV_RULES); if(what==='deploy')B.setup.deploy=pick(['hammer','dawn','search','crucible','sweeping']);
      blog(`drew ${what==='deploy'?'deployment '+LAYOUTS[B.setup.deploy].name:what+': '+B.setup[what]}`); bCommit(); return true; }
    case 'bRollOff': { const what=b.dataset.what; if(!canAct(side)) return true; const r=d6(); B.setup[what==='att'?'attRoll':'firstRoll'][side]=r; blog(`rolled ${r} for ${what==='att'?'Attacker':'first turn'}`,side); bCommit(); return true; }
    case 'bReroll': { const what=b.dataset.what; B.setup[what==='att'?'attRoll':'firstRoll']={}; bCommit(); return true; }
    case 'bAttacker': B.setup.attacker=side; blog(`${SIDES[side]} are the Attacker`); bCommit(); return true;
    case 'bFirst': B.setup.first=side; blog(`${SIDES[side]} take the first turn`); bCommit(); return true;
    case 'bStart': {
      ['tyr','um'].forEach(s=>{ if(B.setup.secMode[s]==='tactical'){const deck=[...LEV_SECONDARY];for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}B.sec[s]={deck,hand:[],done:[]}} });
      B.stage='battle'; B.round=1; B.active=B.setup.first; B.step=0; startCommand(B); blog('The battle begins'); bCommit(); return true; }
    case 'bNext': { if(!canAct(B.active)) return true;
      if(B.step<4){B.step++;blog(`${B_PHASES[B.step]} phase`,B.active)}
      else if(B.active===B.setup.first){B.active=other(B.active);B.step=0;startCommand(B)}
      else if(B.round<5){B.round++;B.active=B.setup.first;B.step=0;blog(`Battle round ${B.round}`);startCommand(B)}
      else{B.stage='end';B.units.tyr.concat(B.units.um).forEach(u=>{if(u.dead)u.ooa=d6()});const t=vpTot(B,'tyr').tot,u=vpTot(B,'um').tot;B.result=t>u?'tyr':u>t?'um':'draw';blog(`The battle ends: Tyranids ${t}, Ultramarines ${u}`)}
      ATK.last=null; bCommit(); return true; }
    case 'bCp': if(!canAct(side)) return true; B.cp[side]=Math.max(0,B.cp[side]+Number(b.dataset.val)); blog(`${Number(b.dataset.val)>0?'gained':'spent'} 1 CP (now ${B.cp[side]})`,side); bCommit(); return true;
    case 'bSecDraw': { const S=B.sec[side]; while(S.hand.length<2&&S.deck.length)S.hand.push(S.deck.shift()); blog(`drew secondaries: ${S.hand.join(', ')}`,side); bCommit(); return true; }
    case 'bSecDone': { const S=B.sec[side]; const c=S.hand.splice(+b.dataset.k,1)[0]; S.done.push(c); blog(`achieved ${c}`,side); bCommit(); return true; }
    case 'bSecDiscard': { const S=B.sec[side]; const c=S.hand.splice(+b.dataset.k,1)[0]; blog(`discarded ${c}`,side); bCommit(); return true; }
    case 'bHurt': { const u=B.units[side][+b.dataset.i]; applyDamage(u,[1],0,''); blog(`${u.name} lost 1 wound${u.dead?' and was destroyed':''}`,side); bCommit(); return true; }
    case 'bQuick': { const v=b.dataset.val; const parts=[];const rolls=v==='D3'?[Math.ceil(d6()/2)]:Array.from({length:parseInt(v)||1},()=>d6()); blog(`rolled ${v}: ${rolls.join(' + ')} = ${rolls.reduce((a,b)=>a+b,0)}`,mySide()!=='both'?mySide():''); bCommit(); return true; }
    case 'bAttack': {
      const s=ATK.side, ally=B.units[s], foes=B.units[other(s)]; const au=ally.find(u=>u.uid===ATK.unit), tu=foes.find(u=>u.uid===ATK.target); if(!au||!tu) return true;
      const melee=B_PHASES[B.step]==='Fight'; const w=(melee?au.melee:au.ranged)[ATK.weapon]; if(!w) return true;
      const res=resolveAttack({weapon:w,target:tu,models:Math.max(1,ATK.models||1),half:ATK.half,still:ATK.still,charged:ATK.charged,cover:ATK.cover,hitMod:+ATK.hitMod,woundMod:+ATK.woundMod,rrHit:ATK.rrHit,rrWound:ATK.rrWound,sus:ATK.sus,lethal:ATK.lethal,adapt:s==='tyr'?state.settings.adaptation:null});
      const ap=applyDamage(tu,res.dmgEvents,res.mortal,ATK.fnp||tu.fnp);
      res.lines.push(`Damage: ${ap.lost} wounds lost${ap.ign?`, ${ap.ign} ignored by Feel No Pain`:''}${res.mortal?` (incl. ${res.mortal} mortal)`:''}; ${ap.slain} model${ap.slain===1?'':'s'} slain${tu.dead?`. ${tu.name} is destroyed!`:''}`);
      if(tu.dead) au.kills++;
      B.lastAttack={title:`${au.name} → ${tu.name} with ${w.name}`,lines:res.lines};
      blog(`${au.name} attacked ${tu.name} with ${w.name}: ${ap.slain} slain${tu.dead?', unit destroyed':''}`,s); bCommit(); return true; }
    case 'bApply': applyCrusade(B,side); return true;
    case 'bReset': if(confirm('Start a new hot-seat game? The current one is lost.')){BATTLE=newBattle('LOCAL');state.battleLocal=BATTLE;save();render()} return true;
  }
  return false;
}
function startCommand(B){B.cp.tyr++;B.cp.um++;const s=B.active;if(B.setup.secMode[s]==='tactical'){const S=B.sec[s];while(S.hand.length<2&&S.deck.length)S.hand.push(S.deck.shift())}blog(`Command phase: both players gain 1CP`,s)}
function applyCrusade(B,side){
  const mfg=(document.getElementById('mfg_'+side)||{}).value;
  if(side==='tyr'){
    const ids=B.units.tyr.map(u=>u.uid);
    state.units.forEach(u=>{const bu=B.units.tyr.find(x=>x.uid===u.id);
      if(!bu){u.t.skipped=n(u.t.skipped)+1;return}
      u.t.played=n(u.t.played)+1; if(!bu.dead)u.t.survived=n(u.t.survived)+1; const before=n(u.t.destroyed); u.t.destroyed=before+bu.kills;
      if(!u.epic){u.xp=n(u.xp)+1+(Math.floor(u.t.destroyed/3)-Math.floor(before/3))+(mfg===u.id?3:0)} if(mfg===u.id)u.t.mfg=n(u.t.mfg)+1;
      if(bu.dead&&bu.ooa===1)u.notes=(u.notes?u.notes+'\n':'')+`Failed Out of Action test after battle ${state.battles.length+1}: choose a Battle Scar or Devastating Blow.`;
    });
    const res=B.result==='tyr'?'W':B.result==='um'?'L':'';
    state.battles.push({date:new Date().toISOString().slice(0,10),opponent:'Ultramarines',result:res,prey:0,preyBio:0,tyr:0,tyrBio:0,infestBio:0,killedAll:B.units.um.every(u=>u.dead),notes:`${B.setup.primary||''} (${vpTot(B,'tyr').tot}–${vpTot(B,'um').tot})`,bio:{},rp:{}});
  } else {
    umState().units.forEach(u=>{const bu=B.units.um.find(x=>x.uid===u.id);if(!bu)return;u.xp=n(u.xp)+1+(mfg===u.id?3:0)+Math.floor(bu.kills/3)});
  }
  B.applied[side]=true; save(); blog(`added the results to their crusade`,side); bCommit();
}
